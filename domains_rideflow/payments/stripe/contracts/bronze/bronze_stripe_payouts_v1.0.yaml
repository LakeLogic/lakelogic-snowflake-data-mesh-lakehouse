version: 1.0.0
info:
  title: "Bronze \u2014 Stripe Payouts"
  table_name: '{bronze_layer}_{system}_payouts'
  description: 'Raw driver payout events from Stripe. One row per payout to driver
    bank account.

    '
  target_layer: bronze
  domain: payments
  system: stripe
model:
  fields:
  - name: PAYOUT_ID
    type: string
    required: true
    description: Stripe payout ID
  - name: DRIVER_ID
    type: string
    required: true
    description: FK to marketplace driver
    foreign_key:
      contract: '{bronze_layer}_rideflow_driver_profiles'
      column: DRIVER_ID
  - name: AMOUNT
    type: string
    description: Payout amount in minor units
  - name: CURRENCY
    type: string
    description: ISO 4217 currency code
  - name: STATUS
    type: string
    description: Payout status (paid, pending, failed)
  - name: PAYOUT_EMAIL
    type: string
    pii: true
    description: Driver payout email
  - name: BANK_ACCOUNT_LAST_FOUR
    type: string
    pii: true
    description: Last 4 of bank account
  - name: ARRIVAL_DATE
    type: string
    description: Expected arrival date
  - name: CREATED_AT
    type: string
    description: Payout creation timestamp
source:
  type: table
  path: table:{catalog}.LANDING.{system}_payouts
  load_mode: full
