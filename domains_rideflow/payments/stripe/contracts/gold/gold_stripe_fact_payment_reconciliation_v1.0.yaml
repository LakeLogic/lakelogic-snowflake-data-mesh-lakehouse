version: 1.0.0
info:
  title: "Gold \u2014 Fact Stripe Payment Reconciliation"
  table_name: '{gold_layer}_stripe_fact_payment_reconciliation'
  description: 'Daily charge volume + status mix per currency. Primary source is silver_stripe_charges;
    per-charge refund / payout linkage is added via downstream joins. Powers the finance
    close dashboard and Zeus refund-SLA alerts.

    '
  target_layer: gold
  domain: payments
  system: stripe
model:
  fields:
  - name: CREATED_DATE
    type: string
    required: true
    description: Aggregation grain (CAST(created_at AS DATE) as ISO string)
  - name: CURRENCY
    type: string
    required: true
  - name: TOTAL_CHARGES
    type: long
  - name: SUCCEEDED_COUNT
    type: long
  - name: FAILED_COUNT
    type: long
  - name: PENDING_COUNT
    type: long
  - name: TOTAL_AMOUNT
    type: float
    description: Sum of all charge amounts
  - name: SUCCESS_AMOUNT
    type: float
    description: Sum of amounts where status = succeeded
  - name: SUCCESS_RATE
    type: float
    description: succeeded_count / total_charges
primary_key:
- CREATED_DATE
- CURRENCY
source:
  type: table
  path: table:{domain_catalog}.silver_stripe_charges
  load_mode: full
transformations:
- phase: pre
  sql: "SELECT\n  CAST(CAST(created_at AS DATE) AS STRING)              AS created_date,\n\
    \  currency                                               AS currency,\n  COUNT(*)\
    \                                               AS total_charges,\n  SUM(CASE\
    \ WHEN status = 'succeeded' THEN 1 ELSE 0 END)  AS succeeded_count,\n  SUM(CASE\
    \ WHEN status = 'failed'    THEN 1 ELSE 0 END)  AS failed_count,\n  SUM(CASE WHEN\
    \ status = 'pending'   THEN 1 ELSE 0 END)  AS pending_count,\n  SUM(CAST(amount\
    \ AS DOUBLE))                            AS total_amount,\n  SUM(CASE WHEN status\
    \ = 'succeeded'\n           THEN CAST(amount AS DOUBLE) ELSE 0 END)       AS success_amount,\n\
    \  CASE WHEN COUNT(*) > 0\n       THEN CAST(SUM(CASE WHEN status = 'succeeded'\
    \ THEN 1 ELSE 0 END) AS DOUBLE)\n            / COUNT(*)\n       ELSE NULL END\
    \                                     AS success_rate\nFROM pay_charges\nGROUP\
    \ BY 1, 2\n"
quality:
  row_rules: []
  dataset_rules: []
links:
- name: pay_charges
  type: table
  path: table:{domain_catalog}.silver_stripe_charges
