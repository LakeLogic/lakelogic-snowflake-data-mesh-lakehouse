version: 1.0.0
info:
  title: "Silver \u2014 Stripe Charges"
  table_name: '{silver_layer}_stripe_charges'
  description: Cleaned, typed, and deduplicated data.
  target_layer: silver
  domain: payments
  system: stripe
model:
  fields:
  - name: CHARGE_ID
    type: string
    required: true
  - name: RIDER_ID
    type: string
    required: true
  - name: TRIP_ID
    type: string
  - name: AMOUNT
    type: float
  - name: CURRENCY
    type: string
  - name: STATUS
    type: string
  - name: PAYMENT_METHOD_TYPE
    type: string
  - name: CARD_LAST_FOUR
    type: string
    pii: true
    masking: hash
  - name: BILLING_EMAIL
    type: string
    pii: true
    masking: hash
  - name: BILLING_ADDRESS
    type: string
    pii: true
    masking: redact
  - name: CREATED_AT
    type: timestamp
  - name: METADATA_JSON
    type: string
primary_key:
- CHARGE_ID
quality:
  row_rules: []
  dataset_rules:
  - unique: CHARGE_ID
transformations:
- deduplicate:
    by:
    - CHARGE_ID
    sort_by:
    - CHARGE_ID
source:
  type: table
  path: table:{domain_catalog}.{bronze_layer}_{system}_charges
  load_mode: full
