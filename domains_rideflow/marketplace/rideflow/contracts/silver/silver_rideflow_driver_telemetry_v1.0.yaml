version: 1.0.0
info:
  title: "Silver \u2014 Rideflow Driver Telemetry"
  table_name: '{silver_layer}_rideflow_driver_telemetry'
  description: Cleaned, typed, and deduplicated data.
  target_layer: silver
  domain: marketplace
  system: rideflow
primary_key:
- TELEMETRY_ID
model:
  fields:
  - name: TELEMETRY_ID
    type: string
    required: true
  - name: DRIVER_ID
    type: string
    required: true
  - name: GPS_LAT
    type: string
  - name: GPS_LNG
    type: string
  - name: SPEED_KMH
    type: float
  - name: HEADING
    type: string
  - name: ACCURACY_METERS
    type: string
  - name: TRIP_ID
    type: string
  - name: STATUS
    type: string
  - name: CITY_CODE
    type: string
  - name: TIMESTAMP
    type: timestamp
quality:
  row_rules: []
  dataset_rules:
  - unique: TELEMETRY_ID
transformations:
- deduplicate:
    by:
    - TELEMETRY_ID
    sort_by:
    - TELEMETRY_ID
source:
  type: table
  path: table:{domain_catalog}.{bronze_layer}_{system}_driver_telemetry
  load_mode: full
