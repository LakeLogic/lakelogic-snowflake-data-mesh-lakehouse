version: 1.0.0
info:
  title: "Silver \u2014 Rideflow Trips"
  table_name: '{silver_layer}_rideflow_trips'
  description: Cleaned, typed, and deduplicated data.
  target_layer: silver
  domain: marketplace
  system: rideflow
primary_key:
- TRIP_ID
model:
  fields:
  - name: TRIP_ID
    type: string
    required: true
  - name: RIDER_ID
    type: string
    required: true
  - name: DRIVER_ID
    type: string
    required: true
  - name: TRIP_TYPE
    type: string
  - name: PICKUP_LAT
    type: string
  - name: PICKUP_LNG
    type: string
  - name: DROPOFF_LAT
    type: string
  - name: DROPOFF_LNG
    type: string
  - name: CITY_CODE
    type: string
  - name: REQUESTED_AT
    type: timestamp
  - name: PICKUP_AT
    type: timestamp
  - name: DROPOFF_AT
    type: timestamp
  - name: DISTANCE_KM
    type: float
  - name: DURATION_MINUTES
    type: integer
  - name: FARE_AMOUNT
    type: float
  - name: SURGE_MULTIPLIER
    type: float
  - name: TIP_AMOUNT
    type: float
  - name: PAYMENT_METHOD
    type: string
  - name: RIDER_RATING
    type: float
  - name: DRIVER_RATING
    type: float
  - name: NOTES
    type: string
quality:
  row_rules:
  - name: positive_spend
    sql: fare_amount >= 0
  - name: valid_rating
    sql: rider_rating IS NULL OR (rider_rating >= 1.0 AND rider_rating <= 5.0)
transformations:
- deduplicate:
    by:
    - TRIP_ID
    sort_by:
    - TRIP_ID
source:
  type: table
  path: table:{domain_catalog}.{bronze_layer}_{system}_trip_completed
  load_mode: full
