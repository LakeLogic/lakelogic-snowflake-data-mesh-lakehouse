version: 1.0.0
info:
  title: "Bronze \u2014 RideFlow Driver Profiles"
  table_name: '{bronze_layer}_{system}_driver_profiles'
  description: 'Raw driver profile data from the RideFlow platform. Contains extensive
    driver PII including name, email, phone, date of birth, licence details, and bank
    account information.

    '
  target_layer: bronze
  domain: marketplace
  system: rideflow
model:
  fields:
  - name: DRIVER_ID
    type: string
    description: Unique driver identifier
  - name: NAME
    type: string
    description: Driver full name
    pii: true
  - name: EMAIL
    type: string
    description: Driver email address
    pii: true
  - name: PHONE
    type: string
    description: Driver phone number
    pii: true
  - name: DATE_OF_BIRTH
    type: string
    description: Driver date of birth
    pii: true
  - name: HOME_ADDRESS
    type: string
    description: Driver home address
    pii: true
  - name: LICENCE_NUMBER
    type: string
    description: Driving licence number
    pii: true
  - name: LICENCE_PLATE
    type: string
    description: Vehicle licence plate
  - name: VEHICLE_TYPE
    type: string
    description: sedan, suv, van, motorcycle, bicycle
  - name: BANK_ACCOUNT_LAST_FOUR
    type: string
    description: Last 4 digits of bank account
  - name: CITY_CODE
    type: string
    description: Primary operating city
  - name: SIGNUP_DATE
    type: string
    description: Account creation date
  - name: STATUS
    type: string
    description: active, inactive, suspended, pending_verification
  - name: RATING
    type: string
    description: Current driver rating
  - name: UPDATED_AT
    type: string
    description: Last profile update timestamp
source:
  type: table
  path: table:{catalog}.LANDING.{system}_driver_profiles
  load_mode: full
