version: 1.0.0
info:
  title: "Bronze \u2014 RideFlow Trip Completed"
  table_name: '{bronze_layer}_{system}_trip_completed'
  description: 'Raw trip completion events from the RideFlow platform. Each row represents
    a completed ride or food delivery. Contains fare, distance, duration, surge, and
    rating data.

    '
  target_layer: bronze
  domain: marketplace
  system: rideflow
model:
  fields:
  - name: TRIP_ID
    type: string
    description: Unique trip identifier
  - name: RIDER_ID
    type: string
    description: FK to rider_profiles
  - name: DRIVER_ID
    type: string
    description: FK to driver_profiles
  - name: TRIP_TYPE
    type: string
    description: ride or eats_delivery
    accepted_values:
    - ride
    - eats_delivery
  - name: PICKUP_LAT
    type: string
    description: Pickup latitude
  - name: PICKUP_LNG
    type: string
    description: Pickup longitude
  - name: DROPOFF_LAT
    type: string
    description: Dropoff latitude
  - name: DROPOFF_LNG
    type: string
    description: Dropoff longitude
  - name: CITY_CODE
    type: string
    description: City code (LON, NYC, BER, PAR, TYO, SYD)
    accepted_values:
    - LON
    - NYC
    - BER
    - PAR
    - TYO
    - SYD
  - name: REQUESTED_AT
    type: string
    description: Trip request timestamp
  - name: PICKUP_AT
    type: string
    description: Actual pickup timestamp
  - name: DROPOFF_AT
    type: string
    description: Actual dropoff timestamp
  - name: DISTANCE_KM
    type: string
    description: Trip distance in kilometres
  - name: DURATION_MINUTES
    type: string
    description: Trip duration in minutes
  - name: FARE_AMOUNT
    type: string
    description: Total fare amount
  - name: SURGE_MULTIPLIER
    type: string
    description: Surge pricing multiplier
  - name: TIP_AMOUNT
    type: string
    description: Tip amount
    accepted_values:
    - 0
    - 0
    - 0
    - 1
    - 1.5
    - 2
    - 2
    - 3
    - 3
    - 4
    - 5
    - 6
    - 8
    - 10
  - name: PAYMENT_METHOD
    type: string
    description: card, apple_pay, google_pay, cash
  - name: RIDER_RATING
    type: string
    description: Rating given by rider (1-5)
  - name: DRIVER_RATING
    type: string
    description: Rating given by driver (1-5)
  - name: NOTES
    type: string
    pii: true
    description: "Free-text trip notes \u2014 may contain rider/driver names, addresses,\
      \ or other PII"
source:
  type: table
  path: table:{catalog}.LANDING.{system}_trip_completed
  load_mode: full
