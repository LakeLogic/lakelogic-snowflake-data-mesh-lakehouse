version: 1.0.0
info:
  title: "Bronze \u2014 RideFlow Driver Telemetry"
  table_name: '{bronze_layer}_{system}_driver_telemetry'
  description: 'Raw GPS telemetry pings from active drivers on the RideFlow platform.
    High-frequency location data (every 5-15 seconds while on trip).

    '
  target_layer: bronze
  domain: marketplace
  system: rideflow
model:
  fields:
  - name: TELEMETRY_ID
    type: string
    description: Unique telemetry ping ID
  - name: DRIVER_ID
    type: string
    description: FK to driver_profiles
  - name: GPS_LAT
    type: string
    description: GPS latitude
  - name: GPS_LNG
    type: string
    description: GPS longitude
  - name: SPEED_KMH
    type: string
    description: Speed in km/h
  - name: HEADING
    type: string
    description: Heading in degrees (0-360)
  - name: ACCURACY_METERS
    type: string
    description: GPS accuracy in meters
  - name: TRIP_ID
    type: string
    description: Active trip ID (null if idle)
  - name: STATUS
    type: string
    description: on_trip, idle, offline
  - name: CITY_CODE
    type: string
    description: City code
  - name: TIMESTAMP
    type: string
    description: Telemetry ping timestamp
source:
  type: table
  path: table:{catalog}.LANDING.{system}_driver_telemetry
  load_mode: full
