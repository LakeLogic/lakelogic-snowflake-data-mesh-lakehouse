version: 1.0.0
info:
  title: "Bronze \u2014 RideFlow Trip Requests"
  table_name: '{bronze_layer}_{system}_trip_requests'
  description: 'Raw trip request events from the RideFlow platform. Each row represents
    a ride or delivery request before assignment.

    '
  target_layer: bronze
  domain: marketplace
  system: rideflow
model:
  fields:
  - name: REQUEST_ID
    type: string
    required: true
    description: Unique request identifier
  - name: RIDER_ID
    type: string
    required: true
    description: FK to rider_profiles
  - name: TRIP_TYPE
    type: string
    description: ride or eats_delivery
  - name: PICKUP_LAT
    type: string
    description: Requested pickup latitude
  - name: PICKUP_LNG
    type: string
    description: Requested pickup longitude
  - name: DROPOFF_LAT
    type: string
    description: Requested dropoff latitude
  - name: DROPOFF_LNG
    type: string
    description: Requested dropoff longitude
  - name: CITY_CODE
    type: string
    description: City code
  - name: REQUESTED_AT
    type: string
    description: Request timestamp
  - name: ESTIMATED_FARE
    type: string
    description: Estimated fare shown to rider
  - name: ESTIMATED_ETA_MINUTES
    type: string
    description: Estimated time of arrival
  - name: SURGE_MULTIPLIER
    type: string
    description: Surge multiplier at time of request
source:
  type: table
  path: table:{catalog}.LANDING.{system}_trip_requests
  load_mode: full
