version: 1.0.0
info:
  title: "Gold \u2014 Dim Driver (SCD2)"
  table_name: '{gold_layer}_rideflow_dim_driver'
  description: "Slowly Changing Dimension (Type 2) for marketplace drivers. Tracks\
    \ history when an attribute that affects analytics changes \u2014 status, vehicle,\
    \ licence, city, rating. Every fact that references driver_id keys via (driver_sk)\
    \ or via (driver_id, effective_from .. effective_to) for point-in-time joins.\n"
  target_layer: gold
  domain: marketplace
  system: rideflow
model:
  fields:
  - name: DRIVER_SK
    type: string
    description: Surrogate key (sha2 hash); new for each SCD2 version
  - name: DRIVER_ID
    type: string
    required: true
    description: "Business key \u2014 stable across versions"
  - name: NAME
    type: string
    pii: true
  - name: EMAIL
    type: string
    pii: true
  - name: PHONE
    type: string
    pii: true
  - name: LICENCE_NUMBER
    type: string
    pii: true
  - name: LICENCE_PLATE
    type: string
    description: "Vehicle plate (SCD2-tracked \u2014 changes when driver switches\
      \ vehicle)"
  - name: VEHICLE_TYPE
    type: string
    description: SCD2-tracked
  - name: CITY_CODE
    type: string
    description: "SCD2-tracked \u2014 driver may move between cities"
  - name: STATUS
    type: string
    description: 'SCD2-tracked: active | inactive | suspended | pending_verification'
  - name: RATING
    type: float
    description: Snapshot at version creation (rating drifts continuously; not SCD2-tracked)
  - name: SIGNUP_DATE
    type: date
  - name: UPDATED_AT
    type: timestamp
    description: "silver_rideflow_driver_profiles.updated_at \u2014 drives version\
      \ cuts"
  - name: EFFECTIVE_FROM
    type: timestamp
    description: When this version became current
  - name: EFFECTIVE_TO
    type: timestamp
    description: Closed when superseded; NULL for current version
  - name: IS_CURRENT
    type: boolean
    description: TRUE for the active version, FALSE for historical versions
  - name: VERSION_NUMBER
    type: long
    description: 1, 2, 3... per driver_id (SCD2 materializer emits bigint)
primary_key:
- DRIVER_ID
natural_key:
- DRIVER_ID
- EFFECTIVE_FROM
source:
  type: table
  path: table:{domain_catalog}.silver_rideflow_driver_profiles
  load_mode: full
materialization:
  strategy: scd2
  format: delta
  scd2:
    surrogate_key: driver_sk
    surrogate_key_strategy: hash
    timestamp_field: updated_at
    effective_from_field: effective_from
    effective_to_field: effective_to
    current_flag_field: is_current
    version_column: version_number
    track_columns:
    - licence_plate
    - vehicle_type
    - city_code
    - status
    - licence_number
    unknown_member:
      enabled: true
      surrogate_key_value: '-1'
quality:
  row_rules: []
  dataset_rules:
  - unique: DRIVER_SK
