domain: marketplace

# ── Domain Ownership ────────────────────────────────────────────────────────
ownership:
  domain_owner: Platform Data Engineering
  team: data_engineering
  contacts:
    - name: Platform Data Lead-test
      role: oncall
      email: ${DOMAIN_CONTACT_MARKETPLACE}
  cost_center: platform_engineering
  jira_project: KAN

# ── Service Level Objectives (SLOs) ──────────────────────────────────────
slo:
  freshness:
    bronze:
      max_delay_minutes: 30
      check_column: _lakelogic_processed_at
      max_source_delay_minutes: 60
      source_check_columns: [updated_at, last_modified, event_timestamp, created_at]
    silver:
      max_delay_minutes: 120
      check_column: _lakelogic_processed_at
      max_source_delay_minutes: 180
      source_check_columns: [updated_at, last_modified, event_timestamp, created_at]
    gold:
      max_delay_minutes: 999999
      check_column: _lakelogic_processed_at
  row_count:
    bronze:
      min_rows: 1
      max_rows: 500000
      warn_only: false
      anomaly:
        enabled: true
        lookback_runs: 14
        min_ratio: 0.5
        max_ratio: 2
        method: median
        min_runs_before_enforcement: 5
    silver:
      min_rows: 10
      max_rows: 500000
      warn_only: false
      anomaly:
        enabled: true
        lookback_runs: 14
        min_ratio: 0.5
        max_ratio: 2
        method: median
        min_runs_before_enforcement: 5
  quality:
    min_good_ratio: 0.92
    max_quarantine_ratio: 0.08
    by_severity:
      critical:
        min_good_ratio: 0.999
      high:
        min_good_ratio: 0.99
      medium:
        min_good_ratio: 0.95
      low:
        min_good_ratio: 0.9
  schedule:
    environments: [dev, prod, staging]
    expected_start_utc: "04:00"
    expected_completion_utc: "05:00"
    expected_duration_minutes: 30
    warn_if_duration_exceeds_minutes: 60
    timezone: UTC

# ── Cost Governance ──────────────────────────────────────────────────────────
cost:
  currency: GBP
  budget:
    daily_limit: 40
    weekly_limit: 200
    monthly_limit: 600
    per_run_anomaly_multiplier: 3

# ── Notifications ────────────────────────────────────────────────────────────
notifications:
  - type: slack
    target: "#data-platform-alerts"
    on_events: [failed]
  - type: slack
    target: "#data-platform-slo-alerts"
    on_events: [slo_breach]
  - type: email
    targets:
      - "platform-data@lakelogic.com"
    on_events: [failed, slo_breach]

# ── Observatory Telemetry ────────────────────────────────────────────────────
observatory:
  enabled: false
  environments: [dev, prod, staging, local, local_polars]
  endpoint: "${LAKELOGIC_OBSERVATORY_ENDPOINT}"
  api_key: "${LAKELOGIC_API_KEY}"
  emit_on: [success, partial, failed]

# ── Compliance & Privacy ─────────────────────────────────────────────────────
compliance:
  sensitivity: Internal
  purpose: "Marketplace operations data — drives surge pricing, dispatch, and KPIs."
  risk_level: medium
  risk_triggers: [pii, cross_border]
  dpo_review_required: false
  frameworks:
    gdpr:
      applicable: true
      jurisdiction: EU/EEA
      legal_basis: legitimate_interest
      special_category_data: false
      dpia_required: false
    ai_act:
      applicable: false
    hipaa:
      applicable: false
    ccpa:
      applicable: false
    sox:
      applicable: false
    lgpd:
      applicable: false
    pipeda:
      applicable: false
    bcbs_239:
      applicable: false
  shared_with:
    - name: Klaviyo Inc.
      role: processor
      country: US
      agreement: DPA
      mechanism: SCCs
  cross_border_transfer: true
  transfer_mechanism: SCCs
  erasure:
    strategy: nullify
  data_residency: EU

# ── Retention ────────────────────────────────────────────────────────────────
retention:
  bronze: P7D
  silver: P90D
  gold: P7Y

# Layer aliases
bronze_layer: bronze
silver_layer: silver
gold_layer: gold