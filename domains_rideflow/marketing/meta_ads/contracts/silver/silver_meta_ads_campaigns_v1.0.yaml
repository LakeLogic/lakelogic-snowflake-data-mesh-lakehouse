version: 1.0.0
info:
  title: "Silver \u2014 Meta Ads Campaigns"
  table_name: '{silver_layer}_meta_ads_campaigns'
  description: Cleaned, typed, and deduplicated data.
  target_layer: silver
  domain: marketing
  system: meta_ads
model:
  fields:
  - name: CAMPAIGN_ID
    type: string
    required: true
  - name: CAMPAIGN_NAME
    type: string
    required: true
  - name: ADSET_ID
    type: string
  - name: ADSET_NAME
    type: string
  - name: DATE
    type: string
  - name: IMPRESSIONS
    type: integer
  - name: CLICKS
    type: integer
  - name: SPEND
    type: string
  - name: ACTIONS_JSON
    type: string
  - name: CONVERSIONS
    type: integer
  - name: CURRENCY
    type: string
primary_key:
- CAMPAIGN_ID
quality:
  row_rules: []
  dataset_rules:
  - unique: CAMPAIGN_ID
transformations:
- deduplicate:
    by:
    - CAMPAIGN_ID
    sort_by:
    - CAMPAIGN_ID
source:
  type: table
  path: table:{domain_catalog}.{bronze_layer}_{system}_campaigns
  load_mode: full
