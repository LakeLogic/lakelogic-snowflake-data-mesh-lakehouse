version: 1.0.0
info:
  title: "Silver \u2014 Hubspot Email Campaigns"
  table_name: '{silver_layer}_hubspot_email_campaigns'
  description: Cleaned, typed, and deduplicated data.
  target_layer: silver
  domain: marketing
  system: hubspot
model:
  fields:
  - name: CAMPAIGN_ID
    type: string
    required: true
  - name: RECIPIENT_EMAIL
    type: string
    required: true
    pii: true
    masking: hash
  - name: RECIPIENT_NAME
    type: string
    pii: true
    masking: redact
  - name: CAMPAIGN_NAME
    type: string
  - name: SUBJECT_LINE
    type: string
  - name: SENT_AT
    type: timestamp
    description: ISO-8601 string (parsed by downstream gold transforms)
  - name: OPENED_AT
    type: timestamp
  - name: CLICKED_AT
    type: timestamp
  - name: BOUNCED
    type: boolean
    description: "true/false flag \u2014 kept as string to match bronze; cast in gold"
  - name: UNSUBSCRIBED
    type: boolean
primary_key:
- CAMPAIGN_ID
quality:
  row_rules: []
  dataset_rules:
  - unique: CAMPAIGN_ID
transformations:
- deduplicate:
    by:
    - CAMPAIGN_ID
    sort_by:
    - CAMPAIGN_ID
source:
  type: table
  path: table:{domain_catalog}.{bronze_layer}_{system}_email_campaigns
  load_mode: full
