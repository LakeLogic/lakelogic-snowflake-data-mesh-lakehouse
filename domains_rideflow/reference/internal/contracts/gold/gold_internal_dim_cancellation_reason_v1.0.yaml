version: 1.0.0
info:
  title: "Gold \u2014 Dim Cancellation Reason"
  table_name: '{gold_layer}_internal_dim_cancellation_reason'
  description: 'Coded cancellation reasons for both riders and drivers. Drives the
    cancellation segmentation that Zeus uses when triaging completion-rate drops in
    marketplace_health.

    '
  target_layer: gold
  domain: reference
  system: internal
model:
  fields:
  - name: REASON_CODE
    type: string
    required: true
    description: Internal code (e.g. RIDER_CHANGED_MIND, DRIVER_NO_SHOW)
  - name: REASON_LABEL
    type: string
    description: User-facing label
  - name: ACTOR
    type: string
    description: 'Who cancelled: rider | driver | system'
  - name: CHARGE_CANCELLATION_FEE
    type: boolean
  - name: COUNTS_AGAINST_DRIVER_RATING
    type: boolean
  - name: SEVERITY
    type: string
    description: "low | medium | high \u2014 drives ops alerting"
quality:
  row_rules: []
  dataset_rules:
  - unique: REASON_CODE
primary_key:
- REASON_CODE
source:
  type: landing
  path: '{landing_root}/dim_cancellation_reason_seed'
  format: csv
  options:
    header: 'true'
  load_mode: full
  watermark_strategy: none
