version: 1.0.0
info:
  title: "Gold \u2014 Fact Revenue Daily"
  table_name: '{gold_layer}_shared_fact_revenue_daily'
  description: 'Daily platform revenue normalized to GBP. Aggregates Stripe charges
    (gross + commission + driver payout + refunds) attributed to Rideflow trips for
    city / vehicle dimensions. One row per (kpi_date, city_code, vehicle_type). Powers
    finance dashboards.

    '
  target_layer: gold
  domain: shared
  system: shared
upstream_contracts:
- contract: silver_stripe_charges
  domain: payments
  system: stripe
  layer: silver
- contract: silver_stripe_refunds
  domain: payments
  system: stripe
  layer: silver
- contract: silver_stripe_payouts
  domain: payments
  system: stripe
  layer: silver
- contract: silver_rideflow_trips
  domain: marketplace
  system: rideflow
  layer: silver
primary_key:
- KPI_DATE
- CITY_CODE
- VEHICLE_TYPE
model:
  fields:
  - name: KPI_DATE
    type: date
    required: true
    description: Calendar date the charge settled (UTC).
  - name: CITY_CODE
    type: string
    description: "Joined from silver_rideflow_trips via charge.trip_id \u2192 trip.city_code."
  - name: VEHICLE_TYPE
    type: string
    description: Joined from silver_rideflow_trips.
  - name: GROSS_REVENUE_AMOUNT
    type: float
    description: Sum of stripe_charges.amount in GBP.
  - name: PLATFORM_COMMISSION_AMOUNT
    type: float
    description: Platform take from gross (currently 25% of fare).
  - name: DRIVER_PAYOUT_AMOUNT
    type: float
    description: Sum of stripe_payouts.amount linked to today's trips.
  - name: REFUND_AMOUNT
    type: float
    description: Sum of stripe_refunds.amount (subtract from gross to get net).
  - name: REFUND_COUNT
    type: integer
  - name: NET_REVENUE_AMOUNT
    type: float
    description: gross_revenue_amount - refund_amount.
  - name: TRIP_COUNT
    type: integer
    description: Count of distinct charged trips (excludes cancelled).
  - name: CURRENCY
    type: string
    description: "Always 'GBP' \u2014 multi-currency conversion happens upstream at\
      \ Silver."
source:
  type: table
  path: table:`{catalog}`.payments.silver_stripe_charges
  load_mode: full
transformations:
- phase: pre
  sql: "WITH c AS (\n  SELECT to_date(pc.created_at)    AS kpi_date,\n         t.city_code\
    \               AS city_code,\n         dv.vehicle_type           AS vehicle_type,\n\
    \         t.driver_id               AS driver_id,\n         pc.trip_id       \
    \         AS trip_id,\n         pc.charge_id              AS charge_id,\n    \
    \     CAST(pc.amount AS double) AS amount\n  FROM pay_charges pc\n  JOIN silver_rideflow_trips\
    \ t ON pc.trip_id = t.trip_id\n  LEFT JOIN mp_drivers dv ON dv.driver_id = t.driver_id\n\
    ),\nagg AS (\n  SELECT kpi_date, city_code, vehicle_type,\n         SUM(amount)\
    \             AS gross_revenue_amount,\n         COUNT(DISTINCT trip_id) AS trip_count\n\
    \  FROM c GROUP BY kpi_date, city_code, vehicle_type\n),\nrf AS (\n  SELECT c.kpi_date,\
    \ c.city_code, c.vehicle_type,\n         SUM(CAST(r.amount AS double)) AS refund_amount,\n\
    \         COUNT(r.refund_id)            AS refund_count\n  FROM c JOIN silver_stripe_refunds\
    \ r ON r.charge_id = c.charge_id\n  GROUP BY c.kpi_date, c.city_code, c.vehicle_type\n\
    ),\npd AS (\n  SELECT driver_id, SUM(CAST(amount AS double)) AS driver_payout\n\
    \  FROM silver_stripe_payouts GROUP BY driver_id\n),\npg AS (\n  SELECT g.kpi_date,\
    \ g.city_code, g.vehicle_type,\n         SUM(pd.driver_payout) AS driver_payout_amount\n\
    \  FROM (SELECT DISTINCT kpi_date, city_code, vehicle_type, driver_id FROM c)\
    \ g\n  LEFT JOIN pd ON pd.driver_id = g.driver_id\n  GROUP BY g.kpi_date, g.city_code,\
    \ g.vehicle_type\n)\nSELECT agg.kpi_date,\n       agg.city_code,\n       agg.vehicle_type,\n\
    \       agg.gross_revenue_amount,\n       0.25 * agg.gross_revenue_amount    \
    \                      AS platform_commission_amount,\n       COALESCE(pg.driver_payout_amount,\
    \ 0.0)                   AS driver_payout_amount,\n       COALESCE(rf.refund_amount,\
    \ 0.0)                          AS refund_amount,\n       CAST(COALESCE(rf.refund_count,\
    \ 0) AS int)                AS refund_count,\n       agg.gross_revenue_amount\
    \ - COALESCE(rf.refund_amount,0.0) AS net_revenue_amount,\n       CAST(agg.trip_count\
    \ AS int)                              AS trip_count,\n       'GBP'          \
    \                                          AS currency\nFROM agg\nLEFT JOIN rf\
    \ ON rf.kpi_date=agg.kpi_date AND rf.city_code=agg.city_code AND rf.vehicle_type=agg.vehicle_type\n\
    LEFT JOIN pg ON pg.kpi_date=agg.kpi_date AND pg.city_code=agg.city_code AND pg.vehicle_type=agg.vehicle_type\n"
quality:
  row_rules:
  - name: net_revenue_non_negative
    sql: net_revenue_amount >= 0
  - name: refund_le_gross
    sql: refund_amount <= gross_revenue_amount
  - name: trip_count_positive
    sql: trip_count >= 0
  dataset_rules: []
materialization:
  strategy: overwrite
  format: delta
links:
- name: pay_charges
  type: table
  path: table:`{catalog}`.payments.silver_stripe_charges
- name: silver_rideflow_trips
  type: table
  path: table:`{catalog}`.marketplace.silver_rideflow_trips
- name: mp_drivers
  type: table
  path: table:`{catalog}`.marketplace.silver_rideflow_driver_profiles
- name: silver_stripe_refunds
  type: table
  path: table:`{catalog}`.payments.silver_stripe_refunds
- name: silver_stripe_payouts
  type: table
  path: table:`{catalog}`.payments.silver_stripe_payouts
