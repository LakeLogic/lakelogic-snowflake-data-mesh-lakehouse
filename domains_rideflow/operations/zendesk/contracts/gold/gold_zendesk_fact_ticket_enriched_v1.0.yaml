version: 1.0.0
info:
  title: "Gold \u2014 Fact Ticket Enriched"
  table_name: '{gold_layer}_zendesk_fact_ticket_enriched'
  description: "Per-ticket enrichment over silver_zendesk_support_tickets:\n  * Classification\
    \ \u2014 assigns a controlled category + intent from the ticket\n    subject /\
    \ body using deterministic keyword rules (portable SQL, $0 cost,\n    no external\
    \ model or network dependency).\n  * Sentiment \u2014 positive / neutral / negative\
    \ + a continuous score.\n  * Urgency \u2014 a normalized score derived from the\
    \ human-set priority.\nAlso resolves the Kimball surrogate keys rider_sk / driver_sk\
    \ against the marketplace SCD2 dimensions (as-of created_at). Powers the support-quality\
    \ dashboard and Zeus incident triage.\n"
  target_layer: gold
  domain: operations
  system: zendesk
model:
  fields:
  - name: TICKET_ID
    type: string
    required: true
    foreign_key:
      contract: '{silver_layer}_{system}_support_tickets'
      column: TICKET_ID
  - name: ENTRY_POINT
    type: string
    description: "in_app_trip | in_app_help | email | phone \u2014 drives FK nullability"
  - name: RIDER_ID
    type: string
    foreign_key:
      contract: '{gold_layer}_rideflow_dim_rider'
      column: RIDER_ID
  - name: RIDER_SK
    type: string
    description: FK to gold_rideflow_dim_rider (SCD2 as-of created_at); '-1' = unknown
    foreign_key:
      contract: '{gold_layer}_rideflow_dim_rider'
      column: RIDER_SK
  - name: TRIP_ID
    type: string
    description: "Nullable \u2014 present on ~75% of tickets"
    foreign_key:
      contract: '{silver_layer}_rideflow_trips'
      column: TRIP_ID
  - name: DRIVER_ID
    type: string
    description: "Nullable \u2014 present on ~55%"
    foreign_key:
      contract: '{gold_layer}_rideflow_dim_driver'
      column: DRIVER_ID
  - name: DRIVER_SK
    type: string
    description: FK to gold_rideflow_dim_driver (SCD2 as-of created_at); '-1' = unknown
    foreign_key:
      contract: '{gold_layer}_rideflow_dim_driver'
      column: DRIVER_SK
  - name: CHARGE_ID
    type: string
    description: "Nullable \u2014 present on ~25% (payment/refund tickets)"
    foreign_key:
      contract: '{silver_layer}_stripe_charges'
      column: CHARGE_ID
  - name: CREATED_AT
    type: timestamp
    description: "Ticket creation time \u2014 the as-of date for rider_sk / driver_sk"
  - name: PERSONS
    type: string
    description: "Reserved \u2014 PERSON entities (NER); null in the deterministic\
      \ variant"
  - name: ORGANIZATIONS
    type: string
    description: "Reserved \u2014 ORG entities (NER); null in the deterministic variant"
  - name: LOCATIONS
    type: string
    description: "Reserved \u2014 GPE / LOC entities (NER); null in the deterministic\
      \ variant"
  - name: CATEGORY
    type: string
    description: Ticket category, keyword-derived from subject / body
    accepted_values:
    - billing_dispute
    - refund_request
    - driver_complaint
    - rider_complaint
    - app_issue
    - lost_item
    - safety_incident
    - account
    - promo_question
    - other
  - name: INTENT
    type: string
    description: Primary intent (independent of category)
    accepted_values:
    - refund
    - cancel
    - complain
    - inquire
    - report_bug
    - praise
  - name: SENTIMENT
    type: string
    description: Overall sentiment label
    accepted_values:
    - positive
    - neutral
    - negative
  - name: SENTIMENT_SCORE
    type: float
    description: Continuous sentiment in [-1, 1]
  - name: URGENCY_SCORE
    type: float
    description: "Normalized urgency in [0, 1] derived from priority \u2014 higher\
      \ = more urgent"
primary_key:
- TICKET_ID
source:
  type: table
  path: table:{domain_catalog}.silver_zendesk_support_tickets
  load_mode: full
links:
- name: dim_rider
  type: table
  path: table:{catalog}.marketplace.gold_rideflow_dim_rider
- name: dim_driver
  type: table
  path: table:{catalog}.marketplace.gold_rideflow_dim_driver
- name: tickets
  type: table
  path: table:{domain_catalog}.silver_zendesk_support_tickets
transformations:
- phase: pre
  sql: "-- Explicit column lists + CONCAT_WS/LOWER/CASE/CAST(... AS FLOAT) so this\n\
    -- runs identically on Spark (the Databricks demo) and DuckDB (local\n-- duckdb/polars\
    \ engines). No `s.*` and no `SELECT * EXCEPT` (Spark-only).\nWITH base AS (\n\
    \  SELECT\n      s.ticket_id,\n      s.entry_point,\n      s.rider_id,\n     \
    \ s.trip_id,\n      s.driver_id,\n      s.charge_id,\n      s.created_at,\n  \
    \    t.priority                                           AS _priority,\n    \
    \  LOWER(CONCAT_WS(' ', t.subject, t.ticket_description)) AS _t\n  FROM source\
    \ s\n  LEFT JOIN tickets t ON s.ticket_id = t.ticket_id\n),\nderived AS (\n  SELECT\n\
    \      b.ticket_id, b.entry_point, b.rider_id, b.trip_id, b.driver_id,\n     \
    \ b.charge_id, b.created_at, b._priority,\n      CAST(NULL AS STRING) AS persons,\n\
    \      CAST(NULL AS STRING) AS organizations,\n      CAST(NULL AS STRING) AS locations,\n\
    \      CASE\n          WHEN b._t LIKE '%refund%'                             \
    \      THEN 'refund_request'\n          WHEN b._t LIKE '%lost item%'         \
    \                       THEN 'lost_item'\n          WHEN b._t LIKE '%safety%'\
    \ OR b._t LIKE '%unsafe%'\n               OR b._t LIKE '%inappropriate%'     \
    \                    THEN 'safety_incident'\n          WHEN b._t LIKE '%promo%'\
    \                                     THEN 'promo_question'\n          WHEN b._t\
    \ LIKE '%double charge%' OR b._t LIKE '%surge pricing%' THEN 'billing_dispute'\n\
    \          WHEN b._t LIKE '%never arrived%' OR b._t LIKE '%longer route%'\n  \
    \             OR (b._t LIKE '%driver%' AND b._t LIKE '%cancelled%')  THEN 'driver_complaint'\n\
    \          WHEN b._t LIKE '%log in%' OR b._t LIKE '%crash%'            THEN 'app_issue'\n\
    \          WHEN b._t LIKE '%phone number%'\n               OR b._t LIKE '%update\
    \ payment method%'                 THEN 'account'\n          ELSE 'other'\n  \
    \    END AS category,\n      CASE\n          WHEN b._t LIKE '%refund%'       \
    \                            THEN 'refund'\n          WHEN b._t LIKE '%cancel%'\
    \                                    THEN 'cancel'\n          WHEN b._t LIKE '%crash%'\
    \ OR b._t LIKE '%log in%'            THEN 'report_bug'\n          WHEN b._t LIKE\
    \ '%wrong%' OR b._t LIKE '%unsafe%'\n               OR b._t LIKE '%inappropriate%'\
    \ OR b._t LIKE '%never arrived%'\n               OR b._t LIKE '%longer route%'\
    \ OR b._t LIKE '%safety%'\n               OR b._t LIKE '%double charge%'     \
    \                    THEN 'complain'\n          ELSE 'inquire'\n      END AS intent,\n\
    \      CASE\n          WHEN b._t LIKE '%wrong%' OR b._t LIKE '%unsafe%'\n    \
    \           OR b._t LIKE '%inappropriate%' OR b._t LIKE '%never arrived%'\n  \
    \             OR b._t LIKE '%longer route%' OR b._t LIKE '%double charge%'\n \
    \              OR b._t LIKE '%cancelled%' OR b._t LIKE '%safety%'\n          \
    \     OR b._t LIKE '%crash%' OR b._t LIKE '%lost item%'      THEN 'negative'\n\
    \          ELSE 'neutral'\n      END AS sentiment\n  FROM base b\n)\nSELECT\n\
    \    d.ticket_id,\n    d.entry_point,\n    d.rider_id,\n    d.trip_id,\n    d.driver_id,\n\
    \    d.charge_id,\n    d.created_at,\n    d.persons,\n    d.organizations,\n \
    \   d.locations,\n    d.category,\n    d.intent,\n    d.sentiment,\n    CAST(CASE\
    \ d.sentiment WHEN 'negative' THEN -0.6\n                          WHEN 'positive'\
    \ THEN  0.6\n                          ELSE 0.0 END AS FLOAT)          AS sentiment_score,\n\
    \    CAST(CASE d._priority WHEN 'urgent' THEN 0.95\n                         \
    \ WHEN 'high'   THEN 0.75\n                          WHEN 'normal' THEN 0.40\n\
    \                          WHEN 'low'    THEN 0.15\n                         \
    \ ELSE 0.40 END AS FLOAT)         AS urgency_score,\n    COALESCE(dr.rider_sk,\
    \  '-1') AS rider_sk,\n    COALESCE(dd.driver_sk, '-1') AS driver_sk\nFROM derived\
    \ d\nLEFT JOIN dim_rider dr\n  ON  d.rider_id   =  dr.rider_id\n  AND d.created_at\
    \ >= dr.effective_from\n  AND d.created_at <  dr.effective_to\nLEFT JOIN dim_driver\
    \ dd\n  ON  d.driver_id  =  dd.driver_id\n  AND d.created_at >= dd.effective_from\n\
    \  AND d.created_at <  dd.effective_to\n"
quality:
  row_rules:
  - not_null: sentiment
  - not_null: category
  dataset_rules: []
