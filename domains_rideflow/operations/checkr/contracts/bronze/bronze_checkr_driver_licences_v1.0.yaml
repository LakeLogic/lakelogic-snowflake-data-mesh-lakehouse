version: 1.0.0
info:
  title: "Bronze \u2014 Checkr Driver Licences Unstructured"
  table_name: '{bronze_layer}_{system}_driver_licences'
  description: Extracting driver details from simulated raw PDF documents using pdfplumber
    regex.
  target_layer: bronze
  domain: operations
  system: checkr
dataset: driver_licences
source:
  type: table
  path: table:{catalog}.LANDING.{system}_*.pdf
  load_mode: full
extraction:
  provider: pdfplumber
model:
  fields:
  - name: FILE_PATH
    type: string
  - name: FULL_NAME
    type: string
    required: true
    extraction_task: metadata
    extraction_examples:
    - Name:\s+(.+)
  - name: LICENCE_NUMBER
    type: string
    required: true
    extraction_task: metadata
    extraction_examples:
    - Licence No:\s+(\S+)
  - name: DATE_OF_BIRTH
    type: date
    extraction_task: metadata
    extraction_examples:
    - DOB:\s+(\d{4}-\d{2}-\d{2})
  - name: EXPIRY_DATE
    type: date
    extraction_task: metadata
    extraction_examples:
    - EXP:\s+(\d{4}-\d{2}-\d{2})
  - name: VEHICLE_CLASSES
    type: string
    extraction_task: metadata
    extraction_examples:
    - Classes:\s+(.+)
quality:
  row_rules:
  - not_null: licence_number
lineage:
  enabled: true
