version: 1.0.0

info:
  title: "Gold \u2014 Dim Driver 360 (cross-domain)"
  table_name: '{gold_layer}_shared_dim_driver_360'
  description: "Per-driver 360 view assembled from THREE source domains:\n  * marketplace\
    \ (silver_rideflow_driver_profiles) \u2014 identity, status, rating\n  * operations\
    \  (silver_checkr_driver_verifications) \u2014 background check status\n  * payments\
    \    (silver_stripe_payouts) \u2014 lifetime payout total\nDemonstrates the true\
    \ cross-domain mart pattern via TransformationJoin.\n"
  target_layer: gold
  domain: shared
  system: shared

model:
  fields:
  - name: DRIVER_ID
    type: string
    required: true
  - name: FULL_NAME
    type: string
    pii: true
  - name: EMAIL
    type: string
    pii: true
  - name: CITY_CODE
    type: string
  - name: STATUS
    type: string
  - name: RATING
    type: float
  - name: VERIFICATION_STATUS
    type: string
    description: checkr report status (clear / consider / suspended)
  - name: VERIFICATION_COMPLETED_AT
    type: timestamp
  - name: LIFETIME_PAYOUT_AMOUNT
    type: float
    description: Sum of stripe_payouts.amount for this driver
  - name: LAST_PAYOUT_DATE
    type: string

primary_key:
- DRIVER_ID

source:
  type: table
  path: table:{catalog}.marketplace.silver_rideflow_driver_profiles
  load_mode: full

transformations:
- phase: pre
  sql: "WITH pd AS (\n  SELECT driver_id,\n         SUM(CAST(amount AS double)) AS\
    \ lifetime_payout_amount,\n         MAX(arrival_date)           AS last_payout_date\n\
    \  FROM silver_stripe_payouts GROUP BY driver_id\n),\ncv AS (\n  SELECT driver_id,\
    \ status, completed_at,\n         ROW_NUMBER() OVER (PARTITION BY driver_id ORDER\
    \ BY completed_at DESC) AS rn\n  FROM silver_checkr_driver_verifications\n)\n\
    SELECT d.driver_id                              AS driver_id,\n       d.name \
    \                                  AS full_name,\n       d.email             \
    \                     AS email,\n       d.city_code                          \
    \    AS city_code,\n       d.status                                 AS status,\n\
    \       CAST(d.rating AS double)                 AS rating,\n       COALESCE(cv.status,\
    \ 'unverified')        AS verification_status,\n       cv.completed_at       \
    \                   AS verification_completed_at,\n       COALESCE(pd.lifetime_payout_amount,\
    \ 0.0) AS lifetime_payout_amount,\n       CAST(pd.last_payout_date AS string)\
    \      AS last_payout_date\nFROM mp_drivers d\nLEFT JOIN (SELECT * FROM cv WHERE\
    \ rn = 1) cv ON cv.driver_id = d.driver_id\nLEFT JOIN pd ON pd.driver_id = d.driver_id\n"

quality:
  row_rules: []
  dataset_rules:
  - unique: DRIVER_ID

materialization:
  strategy: overwrite
  format: delta

links:
- name: mp_drivers
  type: table
  path: table:{catalog}.marketplace.silver_rideflow_driver_profiles
- name: silver_checkr_driver_verifications
  type: table
  path: table:{catalog}.operations.silver_checkr_driver_verifications
- name: silver_stripe_payouts
  type: table
  path: table:{catalog}.payments.silver_stripe_payouts
