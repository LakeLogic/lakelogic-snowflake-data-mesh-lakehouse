# ── Shared Cross-Domain System Registry ──────────────────────────────────────
# Cross-domain Gold products that join data from multiple domains.
# Examples: marketplace_health, revenue_daily, acquisition_cost, driver_360.
domain: shared

system: shared

metadata:
  run_log_table: "{log_path}"
  run_log_backend: "delta"

storage:
  domain_catalog: "{catalog}.shared"

# Cross-domain sources consumed by shared Gold products
external_sources:
  - name: "silver_rideflow_trips"
    catalog_path: "{catalog}.marketplace.silver_rideflow_trips"
    source_domain: "marketplace/rideflow"
    consumed_by: ["marketplace_health", "revenue_daily"]

  - name: "silver_stripe_charges"
    catalog_path: "{catalog}.payments.silver_stripe_charges"
    source_domain: "payments/stripe"
    consumed_by: ["marketplace_health", "revenue_daily"]

  - name: "silver_rideflow_driver_profiles"
    catalog_path: "{catalog}.marketplace.silver_rideflow_driver_profiles"
    source_domain: "marketplace/rideflow"
    consumed_by: ["driver_360"]

  - name: "silver_checkr_driver_verifications"
    catalog_path: "{catalog}.operations.silver_checkr_driver_verifications"
    source_domain: "operations/checkr"
    consumed_by: ["driver_360"]

  - name: "silver_google_ads_campaigns"
    catalog_path: "{catalog}.marketing.silver_google_ads_campaigns"
    source_domain: "marketing/google_ads"
    consumed_by: ["acquisition_cost"]

  - name: "silver_meta_ads_campaigns"
    catalog_path: "{catalog}.marketing.silver_meta_ads_campaigns"
    source_domain: "marketing/meta_ads"
    consumed_by: ["acquisition_cost"]

contracts: []   # Contracts are registered in shared/shared/_system.yaml (system-level).

lineage:
  enabled: true

materialization:
  gold:
    strategy: overwrite
    format: delta

server:
  gold:
    schema_policy:
      evolution: strict
      unknown_fields: quarantine

notifications_enabled: false

x-azure-storage: &azure_storage
  storage_root: "abfss://nondelta@{storage_account}.dfs.core.windows.net"
  data_root: "abfss://shared@{storage_account}.dfs.core.windows.net"
  quarantine_root: "abfss://quarantine@{storage_account}.dfs.core.windows.net"

environments:
  dev:
    catalog: "${SNOWFLAKE_DATABASE}"
    storage_account: "${RIDEFLOW_DEV_STORAGE_ACCOUNT}"
    <<: *azure_storage
  staging:
    catalog: "rideflow_demo_staging"
    storage_account: "${RIDEFLOW_STG_STORAGE_ACCOUNT}"
    <<: *azure_storage
  prod:
    catalog: "rideflow_demo_prod"
    storage_account: "${RIDEFLOW_PROD_STORAGE_ACCOUNT}"
    <<: *azure_storage
  local:
    catalog: "local"
    storage_root: "./lakehouse"
    data_root: "./lakehouse/shared"
    quarantine_root: "./lakehouse/_quarantine"
  colab:
    catalog: "colab"
    storage_root: "/content/lake"
    data_root: "/content/lake/shared"
    quarantine_root: "/content/lake/_quarantine"
