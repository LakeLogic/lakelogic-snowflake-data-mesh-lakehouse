# ── RideFlow Platform System Registry ────────────────────────────────────────
# Core ride-sharing + food delivery platform.
# Entities: riders, drivers, trips, restaurants (Phase 2).
domain: marketplace

system: rideflow

metadata:
  # UC mode: run/SLO logs are MANAGED UC Delta tables in the marketplace domain.
  # A Volume path (e.g. {log_root}/…) fails here — the deltalake writer needs
  # atomic renames the Volume FUSE layer forbids ("Operation not permitted").
  # A managed table ({catalog}.{domain}.<table>) is created via Spark and works.
  # backend: spark → written via Spark saveAsTable = a MANAGED UC Delta table.
  # (backend: delta uses the path-based deltalake writer, which needs atomic
  # renames a UC Volume forbids — that is what failed here.)
  run_log_table: "{domain_catalog}._pipeline_run_log"
  run_log_backend: "snowflake"
  snowflake_database: "{catalog}"
  snowflake_schema: "{domain}"
  slo_checks_table: "{domain_catalog}._slo_checks"
  slo_checks_backend: "snowflake"

quarantine:
  enabled: true
  fail_on_quarantine: false
  include_error_reason: true
  format: "delta"
  mode: "append"

storage:
  # ── Table Resolution ──────────────────────────────────────────────────────
  domain_catalog: "{catalog}.{domain}"
  quarantine_root: "{catalog}.QUARANTINE"

  # ── Operational Paths (UC mode — Databricks Volumes) ──────────────────────
  contract_root: "/Workspace/Shared/data_platform/contracts/{domain}/{system}"
  landing_root: "/Volumes/{catalog}/nondelta/landing_{domain}/{system}"
  log_root: "/Volumes/{catalog}/nondelta/_logs"

  # ── Storage Paths (direct mode — cloud/local) ────────────────────────────
  # Resolve relative to data_root so local envs land on disk; cloud envs land on abfss.

# ── External Sources (for lineage visualization) ────────────────────────────
external_sources:
  - name: "RideFlow Platform API"
    type: api
    source_domain: "Internal Platform"
    catalog_path: "rideflow_backend_api"
    consumed_by:
      - "rider_profiles"
      - "rider_app_events"
      - "driver_profiles"
      - "driver_telemetry"
      - "trip_requests"
      - "trip_completed"
      - "trip_cancellations"

# ── Contract Registry ───────────────────────────────────────────────────────
contracts:
  # Bronze Layer
  - layer: bronze
    entity: rider_profiles
    path: "contracts/{bronze_layer}/{bronze_layer}_{system}_rider_profiles_v1.0.yaml"
    enabled: true
  - layer: bronze
    entity: rider_app_events
    path: "contracts/{bronze_layer}/{bronze_layer}_{system}_rider_app_events_v1.0.yaml"
    enabled: true
  - layer: bronze
    entity: driver_profiles
    path: "contracts/{bronze_layer}/{bronze_layer}_{system}_driver_profiles_v1.0.yaml"
    enabled: true
  - layer: bronze
    entity: driver_telemetry
    path: "contracts/{bronze_layer}/{bronze_layer}_{system}_driver_telemetry_v1.0.yaml"
    enabled: true
  - layer: bronze
    entity: trip_requests
    path: "contracts/{bronze_layer}/{bronze_layer}_{system}_trip_requests_v1.0.yaml"
    enabled: true
  - layer: bronze
    entity: trip_completed
    path: "contracts/{bronze_layer}/{bronze_layer}_{system}_trip_completed_v1.0.yaml"
    enabled: true
  - layer: bronze
    entity: trip_cancellations
    path: "contracts/{bronze_layer}/{bronze_layer}_{system}_trip_cancellations_v1.0.yaml"
    enabled: true

# Silver Layer
  - layer: silver
    entity: silver_rideflow_driver_profiles
    path: "contracts/{silver_layer}/silver_rideflow_driver_profiles_v1.0.yaml"

    enabled: true
  - layer: silver
    entity: silver_rideflow_driver_telemetry
    path: "contracts/{silver_layer}/silver_rideflow_driver_telemetry_v1.0.yaml"
    depends_on: ['silver_rideflow_driver_profiles']
    enabled: true
  - layer: silver
    entity: silver_rideflow_rider_profiles
    path: "contracts/{silver_layer}/silver_rideflow_rider_profiles_v1.0.yaml"

    enabled: true
  - layer: silver
    entity: silver_rideflow_trips
    path: "contracts/{silver_layer}/silver_rideflow_trips_v1.0.yaml"
    depends_on: ['trip_completed', 'silver_rideflow_rider_profiles', 'silver_rideflow_driver_profiles']
    enabled: true
  - layer: silver
    entity: silver_rideflow_trip_requests
    path: "contracts/{silver_layer}/silver_rideflow_trip_requests_v1.0.yaml"
    depends_on: ['trip_requests']
    enabled: true
  - layer: silver
    entity: silver_rideflow_trip_cancellations
    path: "contracts/{silver_layer}/silver_rideflow_trip_cancellations_v1.0.yaml"
    depends_on: ['trip_cancellations']
    enabled: true

# Gold Layer
  - layer: gold
    entity: gold_rideflow_fact_trip_daily_kpis
    path: "contracts/{gold_layer}/gold_rideflow_fact_trip_daily_kpis_v1.0.yaml"
    depends_on: ['silver_rideflow_trips']
    enabled: true
  - layer: gold
    entity: gold_rideflow_dim_driver_scorecard
    path: "contracts/{gold_layer}/gold_rideflow_dim_driver_scorecard_v1.0.yaml"
    # dim_driver must build first — the scorecard resolves driver_sk against it.
    depends_on: ['silver_rideflow_trips', 'silver_rideflow_driver_profiles', 'gold_rideflow_dim_driver']
    enabled: true
  - layer: gold
    entity: gold_rideflow_fact_rider_daily_metrics
    path: "contracts/{gold_layer}/gold_rideflow_fact_rider_daily_metrics_v1.0.yaml"
    # dim_rider must build first — the fact resolves rider_sk against it (as-of join).
    depends_on: ['silver_rideflow_trips', 'silver_rideflow_rider_profiles', 'gold_rideflow_dim_rider']
    enabled: true
  - layer: gold
    entity: gold_rideflow_fact_surge_pricing_inference
    path: "contracts/{gold_layer}/gold_rideflow_fact_surge_pricing_inference_v1.0.yaml"
    depends_on: ['silver_rideflow_trips']
    enabled: false
  - layer: gold
    entity: gold_rideflow_dim_driver
    path: "contracts/{gold_layer}/gold_rideflow_dim_driver_v1.0.yaml"
    depends_on: ['silver_rideflow_driver_profiles']
    enabled: true
  - layer: gold
    entity: gold_rideflow_dim_rider
    path: "contracts/{gold_layer}/gold_rideflow_dim_rider_v1.0.yaml"
    depends_on: ['silver_rideflow_rider_profiles']
    enabled: true

# ── Lineage (inherited by all contracts) ────────────────────────────────────
lineage:
  enabled: true
  source_column_name: "_lakelogic_source"
  timestamp_column_name: "_lakelogic_processed_at"
  run_id_column_name: "_lakelogic_run_id"
  contract_name_column_name: "_lakelogic_contract_name"
  capture_domain: false
  capture_system: false

# ── Materialization (per-layer defaults, contracts override) ────────────────
materialization:
  bronze:
    strategy: append
    format: delta
  silver:
    strategy: merge
    format: delta
    merge_dedup_guard: true
  gold:
    strategy: merge
    format: delta

# ── Server Defaults (per-layer, contracts override) ─────────────────────────
server:
  bronze:
    cast_to_string: true
    schema_policy:
      evolution: append
      unknown_fields: allow
    post_ingestion:
      action: retain                   # delete | archive | retain
      cleanup_is_blocking: false        # if true, cleanup failure fails the pipeline; false = warn only
      retry_orphaned_files: true        # retry cleanup of previously failed files on next run
  silver:
    schema_policy:
      evolution: strict
      # `drop` projects bronze rows to silver's declared model — extra columns
      # are silently discarded rather than quarantining the whole row. `strict`
      # still prevents the silver CONTRACT from gaining unintended new fields;
      # this knob just lets upstream stay slightly wider without blocking us.
      unknown_fields: drop
  gold:
    schema_policy:
      # strict is fine as of lakelogic 1.36.0: the schema-enforcement escape hatch
      # now recognises SCD2 materialization + post-phase rollup/derive, so the
      # materializer-injected columns (surrogate key, effective_from/to, is_current,
      # version) and aggregate outputs no longer quarantine every row.
      evolution: strict
      unknown_fields: drop

# ── Cost Observability ──────────────────────────────────────────────────────
cost:
  provider: "manual"
  attribution: "duration_proportional"
  currency: "GBP"
  rates:
    dbu_per_hour: 0.22
    storage_per_gb_month: 0.023
  cluster:
    min_nodes: 2
    max_nodes: 8
    scaling_assumption: "avg"
  layer_rates:
    bronze:
      dbu_per_hour: 0.15
      cluster:
        min_nodes: 1
        max_nodes: 4
        scaling_assumption: "min"
    silver:
      dbu_per_hour: 0.22
    gold:
      dbu_per_hour: 0.55
      cluster:
        min_nodes: 1
        max_nodes: 16
        scaling_assumption: "p75"

notifications_enabled: false

# ══════════════════════════════════════════════════════════════════════════════
# ENVIRONMENTS
# ══════════════════════════════════════════════════════════════════════════════

x-azure-storage: &azure_storage
  storage_root: "abfss://nondelta@{storage_account}.dfs.core.windows.net"
  data_root: "abfss://{domain}@{storage_account}.dfs.core.windows.net"

environments:
  dev:
    catalog: "${SNOWFLAKE_DATABASE}"
    storage_account: "${RIDEFLOW_DEV_STORAGE_ACCOUNT}"
    <<: *azure_storage
  staging:
    catalog: "${SNOWFLAKE_DATABASE}"
    storage_account: "${RIDEFLOW_STG_STORAGE_ACCOUNT}"
    <<: *azure_storage
  prod:
    catalog: "${SNOWFLAKE_DATABASE}"
    storage_account: "${RIDEFLOW_PROD_STORAGE_ACCOUNT}"
    <<: *azure_storage
  local:
    catalog: "local"
    storage_root: "./lakehouse"
    data_root: "./lakehouse/{domain}"
  local_polars:
    catalog: "local"
    storage_root: "./lakehouse_polars"
    data_root: "./lakehouse_polars/{domain}"
  local_duckdb:
    catalog: "local"
    storage_root: "./lakehouse_duckdb"
    data_root: "./lakehouse_duckdb/{domain}"
  local_spark:
    catalog: "local"
    storage_root: "./lakehouse_spark"
    data_root: "./lakehouse_spark/{domain}"
  colab:
    catalog: "colab"
    storage_root: "/content/lake"
    data_root: "/content/lake/{domain}"
