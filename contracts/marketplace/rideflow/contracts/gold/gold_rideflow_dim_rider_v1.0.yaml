version: 1.0.0

info:
  title: "Gold \u2014 Dim Rider (SCD2)"
  table_name: '{gold_layer}_rideflow_dim_rider'
  description: "Slowly Changing Dimension (Type 2) for marketplace riders. Tracks\
    \ history when an attribute that affects analytics changes \u2014 status, home\
    \ city, preferred payment method. Used for point-in-time joins by every fact that\
    \ references rider_id.\n"
  target_layer: gold
  domain: marketplace
  system: rideflow

model:
  fields:
  - name: RIDER_SK
    type: string
    description: Surrogate key (sha2 hash); new for each SCD2 version
  - name: RIDER_ID
    type: string
    required: true
    description: "Business key \u2014 stable across versions"
  - name: NAME
    type: string
    pii: true
  - name: EMAIL
    type: string
    pii: true
  - name: PHONE
    type: string
    pii: true
  - name: HOME_ADDRESS
    type: string
    pii: true
    description: "SCD2-tracked \u2014 rider may move"
  - name: CITY_CODE
    type: string
    description: "SCD2-tracked \u2014 primary operating city"
  - name: STATUS
    type: string
    description: 'SCD2-tracked: active | inactive | suspended'
  - name: PREFERRED_PAYMENT_METHOD
    type: string
    description: "SCD2-tracked \u2014 payment method preference change"
  - name: SIGNUP_DATE
    type: date
  - name: UPDATED_AT
    type: timestamp
    description: "silver_rideflow_rider_profiles.updated_at \u2014 drives version\
      \ cuts"
  - name: EFFECTIVE_FROM
    type: timestamp
  - name: EFFECTIVE_TO
    type: timestamp
    description: Closed when superseded; NULL for current version
  - name: IS_CURRENT
    type: boolean

primary_key:
- RIDER_ID

source:
  type: table
  path: table:{domain_catalog}.silver_rideflow_rider_profiles
  load_mode: full

materialization:
  strategy: scd2
  format: delta
  scd2:
    surrogate_key: rider_sk
    surrogate_key_strategy: hash
    timestamp_field: updated_at
    effective_from_field: effective_from
    effective_to_field: effective_to
    current_flag_field: is_current
    change_reason_column: ''
    track_columns:
    - city_code
    - home_address
    - status
    - preferred_payment_method
    unknown_member:
      enabled: true
      surrogate_key_value: '-1'

quality:
  row_rules: []
  dataset_rules:
  - unique: RIDER_SK
