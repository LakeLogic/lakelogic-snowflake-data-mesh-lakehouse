version: 1.0.0

info:
  data_product: rider_and_driver_profiles
  data_product_output: dim_rider
  title: Gold — Dim Rider Profiles (SCD2)
  target_layer: gold
  description: Rider profile history from the Rideflow marketplace, holding one record
    per saved version of each rider's account so changes can be traced over time.
    It carries rider identifiers, the city they are associated with, signup dates,
    account status and preferred payment method, along with the dates each version
    was in effect and a flag for the current one. A placeholder entry stands in when
    a rider cannot be matched.
  table_name: '{gold_layer}_dim_rider_profiles'
  system: rideflow
  domain: marketplace

model:
  fields:
  - name: rider_profiles_sk
    type: string
    required: false
    description: 'Surrogate key: sha256 of the business key and the version start,
      written by the materializer; ''-1'' is the unknown member.'
  - name: rider_id
    type: string
    required: true
    description: Unique identifier for each rider in the Rideflow marketplace. Used
      to link a rider to their trips, payments and support history.
  - name: effective_from
    type: timestamp
    required: false
    description: SCD2 effective from, written by the materializer.
  - name: effective_to
    type: timestamp
    required: false
    description: SCD2 effective to, written by the materializer.
  - name: is_current
    type: boolean
    required: false
    description: SCD2 current flag, written by the materializer.
  - name: version_number
    type: long
    required: false
    description: SCD2 version column, written by the materializer.
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_dim_rider_profiles

primary_key:
- rider_id

materialization:
  strategy: scd2
  scd2:
    surrogate_key: rider_profiles_sk
    surrogate_key_strategy: hash
    timestamp_field: updated_at
    effective_from_field: effective_from
    effective_to_field: effective_to
    current_flag_field: is_current
    version_column: version_number
    track_columns:
    - city_code
    - status
    - preferred_payment_method
    unknown_member:
      enabled: true
      surrogate_key_value: '-1'

quality:
  dataset_rules:
  - unique:
      columns:
      - rider_id
      - effective_from
      name: rider_id_effective_from_unique
      category: uniqueness
      description: No two rows share the same rider_id, effective_from.

source:
  type: table
  path: table:{silver_root}.{silver_layer}_rideflow_rider_profiles
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'

transformations:
- phase: pre
  derive:
    field: system
    sql: '''rideflow'''
