version: 1.0.0

info:
  data_product: rider_and_driver_profiles
  data_product_output: dim_driver
  title: Gold — Dim Driver Profiles (SCD2)
  target_layer: gold
  description: Driver profile history for a ride-hailing marketplace, capturing each
    driver's operating city, account status, average customer rating and signup date,
    with dated versions showing when a profile became active and whether it is the
    current one. Records trace back to their originating source system.
  table_name: '{gold_layer}_dim_driver_profiles'
  system: rideflow
  domain: marketplace

model:
  fields:
  - name: driver_profiles_sk
    type: string
    required: false
    description: 'Surrogate key: sha256 of the business key and the version start,
      written by the materializer; ''-1'' is the unknown member.'
  - name: driver_id
    type: string
    required: true
    description: Unique identifier for each driver on the marketplace platform. Used
      to link driver profiles to their trips, payouts and support records.
  - name: vehicle_type
    type: string
    required: false
    description: The category of vehicle the driver operates, such as car or motorbike.
      Helps match drivers to the right ride requests.
  - name: city_code
    type: string
    required: false
    description: Short code for the city where the driver operates. Used to group
      drivers by market for reporting and operations.
  - name: signup_date
    type: date
    required: false
    description: The date the driver joined the platform. Used to track driver tenure
      and onboarding trends.
  - name: status
    type: string
    required: false
    description: The driver's current account state, such as active or suspended.
      Determines whether the driver can accept trips.
  - name: rating
    type: float
    required: false
    description: The driver's average customer rating. Used to monitor service quality
      and driver performance.
  - name: effective_from
    type: timestamp
    required: false
    description: SCD2 effective from, written by the materializer.
  - name: effective_to
    type: timestamp
    required: false
    description: SCD2 effective to, written by the materializer.
  - name: is_current
    type: boolean
    required: false
    description: SCD2 current flag, written by the materializer.
  - name: version_number
    type: long
    required: false
    description: SCD2 version column, written by the materializer.
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_dim_driver_profiles

primary_key:
- driver_id

materialization:
  strategy: scd2
  scd2:
    surrogate_key: driver_profiles_sk
    surrogate_key_strategy: hash
    timestamp_field: updated_at
    effective_from_field: effective_from
    effective_to_field: effective_to
    current_flag_field: is_current
    version_column: version_number
    track_columns:
    - vehicle_type
    - city_code
    - status
    - rating
    unknown_member:
      enabled: true
      surrogate_key_value: '-1'

quality:
  dataset_rules:
  - unique:
      columns:
      - driver_id
      - effective_from
      name: driver_id_effective_from_unique
      category: uniqueness
      description: No two rows share the same driver_id, effective_from.

source:
  type: table
  path: table:{silver_root}.{silver_layer}_rideflow_driver_profiles
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'

transformations:
- phase: pre
  derive:
    field: system
    sql: '''rideflow'''
