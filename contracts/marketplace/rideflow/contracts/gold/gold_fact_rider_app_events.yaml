version: 1.0.0

info:
  title: Gold — Fact Rider App Events
  target_layer: gold
  description: Rider activity captured from the RideFlow rider app, one record per
    event, recording when it happened, which app release was in use, and the screen,
    event type and device platform involved, each resolved against reference lists
    with unmatched values flagged. Records trace back to the source system they originated
    from and link to a rider profile where one could be matched. The data supports
    ordering and analysing rider behaviour over time and across app releases.
  table_name: '{gold_layer}_fact_rider_app_events'
  system: rideflow
  domain: marketplace

model:
  fields:
  - name: event_id
    type: string
    required: true
    description: Unique identifier for a single rider app event, used to trace and
      de-duplicate activity records.
  - name: event_timestamp
    type: timestamp
    required: false
    description: When the event happened, used to order and analyse rider activity
      over time.
  - name: event_name
    type: string
    required: false
    description: The type of action the rider took in the app, such as opening a screen
      or requesting a ride.
  - name: screen_name
    type: string
    required: false
    description: The app screen where the event occurred, showing where riders spend
      time in the app.
  - name: app_version
    type: string
    required: false
    description: The version of the rider app in use, helping explain behaviour differences
      across releases.
  - name: platform
    type: string
    required: false
    description: The device platform (such as iOS or Android) the rider used, supporting
      platform-level analysis.
  - name: rider_sk
    type: string
    required: true
    foreign_key:
      contract: gold_dim_rider_profiles
      column: rider_profiles_sk
    description: Surrogate key of gold_dim_rider_profiles, looked up as of event_timestamp;
      '-1' when the dimension does not know the row.
  - name: city_sk
    type: string
    required: true
    foreign_key:
      contract: gold_dim_city_master
      column: city_master_sk
    description: Surrogate key of gold_dim_city_master, looked up as of event_timestamp;
      '-1' when the dimension does not know the row.
  - name: platform_sk
    type: string
    required: true
    foreign_key:
      contract: gold_rideflow_dim_platform
      column: platform_sk
    description: Surrogate key of gold_rideflow_dim_platform, looked up on its business
      key; '-1' when the dimension does not know the row.
  - name: event_date
    type: date
    required: false
    description: 'Partition column: the calendar date of `event_timestamp`.'
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_fact_rider_app_events

primary_key:
- event_id

quality:
  dataset_rules:
  - unique:
      columns:
      - event_id
      name: event_id_unique
      category: uniqueness
      description: No two rows share the same event_id.
  - name: rider_sk_unknown_member_rows
    sql: SELECT COUNT(*) FROM {dataset} WHERE rider_sk = '-1'
    must_be_less_than: 1
    severity: warning
    category: consistency
    description: Rows whose rider_sk fell back to the unknown member — the dimension
      did not know them when this fact ran.
  - name: city_sk_unknown_member_rows
    sql: SELECT COUNT(*) FROM {dataset} WHERE city_sk = '-1'
    must_be_less_than: 1
    severity: warning
    category: consistency
    description: Rows whose city_sk fell back to the unknown member — the dimension
      did not know them when this fact ran.
  - name: platform_sk_unknown_member_rows
    sql: SELECT COUNT(*) FROM {dataset} WHERE platform_sk = '-1'
    must_be_less_than: 1
    severity: warning
    category: consistency
    description: Rows whose platform_sk fell back to the unknown member — the dimension
      did not know them when this fact ran.

transformations:
- phase: pre
  sql: |-
    SELECT
      r.event_id,
      r.event_timestamp,
      r.event_name,
      r.screen_name,
      r.app_version,
      r.platform,
      COALESCE(d1.rider_profiles_sk, '-1') AS rider_sk,
      COALESCE(d2.city_master_sk, '-1') AS city_sk,
      COALESCE(d3.platform_sk, '-1') AS platform_sk,
      CAST(r.event_timestamp AS DATE) AS event_date
    FROM source r
    LEFT JOIN gold_dim_rider_profiles d1
      ON  r.rider_id = d1.rider_id
      AND r.event_timestamp >= d1.effective_from
      AND r.event_timestamp < COALESCE(d1.effective_to, CAST('9999-12-31 00:00:00' AS TIMESTAMP))
    LEFT JOIN gold_dim_city_master d2
      ON  r.city_code = d2.city_code
      AND r.event_timestamp >= d2.effective_from
      AND r.event_timestamp < COALESCE(d2.effective_to, CAST('9999-12-31 00:00:00' AS TIMESTAMP))
    LEFT JOIN gold_rideflow_dim_platform d3
      ON  r.platform = d3.platform
- phase: pre
  derive:
    field: system
    sql: '''rideflow'''

links:
- name: gold_dim_rider_profiles
  type: table
  path: table:{gold_root}.{gold_layer}_dim_rider_profiles
- name: gold_dim_city_master
  type: table
  path: table:`{domain_catalog_prefix}_reference`.{gold_layer}.{gold_layer}_dim_city_master
- name: gold_rideflow_dim_platform
  type: table
  path: table:{gold_root}.{gold_layer}_rideflow_dim_platform

upstream:
- gold_dim_city_master
- gold_dim_rider_profiles
- gold_rideflow_dim_platform

materialization:
  strategy: append
  fact:
    type: factless
  partition_by:
  - event_date

source:
  type: table
  path: table:{silver_root}.{silver_layer}_rideflow_rider_app_events
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
