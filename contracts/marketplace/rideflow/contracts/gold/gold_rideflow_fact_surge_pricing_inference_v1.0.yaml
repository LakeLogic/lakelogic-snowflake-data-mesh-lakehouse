version: 1.0.0

info:
  title: "Gold \u2014 Fact Surge Pricing Inference"
  table_name: '{gold_layer}_{system}_fact_surge_pricing_inference'
  description: Tracks ML inference outputs for dynamic surge pricing, classifying
    ML behavior against EU AI Act bounds.
  target_layer: gold
  domain: marketplace
  system: rideflow

dataset: surge_pricing_inference

source:
  type: landing
  format: parquet
  path: '{storage_root}/{domain}/surge_inference_landing'

primary_key:
- INFERENCE_ID

model:
  fields:
  - name: INFERENCE_ID
    type: string
    required: true
  - name: MODEL_VERSION
    type: string
    required: true
  - name: CITY_CODE
    type: string
  - name: DEMAND_INDEX
    type: float
  - name: SURGE_MULTIPLIER
    type: float
    required: true
  - name: TIMESTAMP
    type: timestamp
    required: true

quality:
  row_rules:
  - name: valid_surge_bounds
    sql: surge_multiplier >= 1.0 AND surge_multiplier <= 5.0
  - name: demand_index_bounds
    sql: demand_index >= 0.0 AND demand_index <= 10.0
  dataset_rules:
  - unique: INFERENCE_ID

transformations: []

lineage:
  enabled: true
