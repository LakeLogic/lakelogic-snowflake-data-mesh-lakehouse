version: 1.0.0

info:
  title: Gold — Fact Trip Completed
  target_layer: gold
  description: Completed rides from the rideflow marketplace platform, each one identified
    by a unique trip reference and linked to the driver, rider, trip category and
    payment method involved. The record carries the money side of the journey — fare
    charged, tip added, surge multiplier applied and how the rider paid — alongside
    distance, duration and the request, pickup and dropoff timestamps, plus the ratings
    both rider and driver gave. Trips are tagged to a city and a service level, and
    free-text notes may hold support or dispute context.
  table_name: '{gold_layer}_fact_trip_completed'
  system: rideflow
  domain: marketplace

model:
  fields:
  - name: trip_id
    type: string
    required: true
    description: Unique identifier for a single completed ride, used to trace each
      trip across bookings, billing and support.
  - name: total_fare_amount
    type: decimal(10,2)
    required: false
    description: Total fare charged to the rider for the trip, in the platform's currency.
  - name: total_tip_amount
    type: decimal(10,2)
    required: false
    description: Total tip the rider added on top of the fare for this trip.
  - name: total_distance_km
    type: float
    required: false
    description: Distance travelled on the trip, in kilometres.
  - name: total_duration_minutes
    type: integer
    required: false
    description: Length of the trip in minutes, from start to completion.
  - name: avg_rider_rating
    type: float
    required: false
    description: Average rating the rider gave for this trip, on the platform's rating
      scale.
  - name: trip_type
    type: string
    required: false
    description: Category of the ride (for example standard or premium), used to compare
      service levels and pricing.
  - name: requested_at
    type: timestamp
    required: false
    description: When the rider requested the trip, useful for measuring wait times
      and demand patterns.
  - name: pickup_at
    type: timestamp
    required: false
    description: When the rider was actually picked up, marking the start of the paid
      journey.
  - name: dropoff_at
    type: timestamp
    required: false
    description: When the rider was dropped off, marking the end of the journey and
      used to calculate trip duration.
  - name: surge_multiplier
    type: float
    required: false
    description: How much the fare was scaled up during high-demand periods, helping
      explain price variation.
  - name: rider_rating
    type: float
    required: false
    description: The score the rider gave the driver for this trip, a signal of customer
      satisfaction.
  - name: driver_rating
    type: float
    required: false
    description: The score the driver gave the rider for this trip, used to monitor
      rider behaviour.
  - name: driver_sk
    type: string
    required: true
    foreign_key:
      contract: gold_dim_driver_profiles
      column: driver_profiles_sk
    description: Surrogate key of gold_dim_driver_profiles, looked up as of dropoff_at;
      '-1' when the dimension does not know the row.
  - name: rider_sk
    type: string
    required: true
    foreign_key:
      contract: gold_dim_rider_profiles
      column: rider_profiles_sk
    description: Surrogate key of gold_dim_rider_profiles, looked up as of dropoff_at;
      '-1' when the dimension does not know the row.
  - name: city_sk
    type: string
    required: true
    foreign_key:
      contract: gold_dim_city_master
      column: city_master_sk
    description: Surrogate key of gold_dim_city_master, looked up as of dropoff_at;
      '-1' when the dimension does not know the row.
  - name: payment_method_sk
    type: string
    required: true
    foreign_key:
      contract: gold_dim_payment_method
      column: payment_method_sk
    description: Surrogate key of gold_dim_payment_method, looked up on its business
      key; '-1' when the dimension does not know the row.
  - name: dropoff_date
    type: date
    required: false
    description: 'Partition column: the calendar date of `dropoff_at`.'
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_fact_trip_completed

primary_key:
- trip_id

quality:
  dataset_rules:
  - unique:
      columns:
      - trip_id
      name: trip_id_unique
      category: uniqueness
      description: No two rows share the same trip_id.
  - name: driver_sk_unknown_member_rows
    sql: SELECT COUNT(*) FROM {dataset} WHERE driver_sk = '-1'
    must_be_less_than: 1
    severity: warning
    category: consistency
    description: Rows whose driver_sk fell back to the unknown member — the dimension
      did not know them when this fact ran.
  - name: rider_sk_unknown_member_rows
    sql: SELECT COUNT(*) FROM {dataset} WHERE rider_sk = '-1'
    must_be_less_than: 1
    severity: warning
    category: consistency
    description: Rows whose rider_sk fell back to the unknown member — the dimension
      did not know them when this fact ran.
  - name: city_sk_unknown_member_rows
    sql: SELECT COUNT(*) FROM {dataset} WHERE city_sk = '-1'
    must_be_less_than: 1
    severity: warning
    category: consistency
    description: Rows whose city_sk fell back to the unknown member — the dimension
      did not know them when this fact ran.
  - name: payment_method_sk_unknown_member_rows
    sql: SELECT COUNT(*) FROM {dataset} WHERE payment_method_sk = '-1'
    must_be_less_than: 1
    severity: warning
    category: consistency
    description: Rows whose payment_method_sk fell back to the unknown member — the
      dimension did not know them when this fact ran.

transformations:
- phase: pre
  sql: |-
    SELECT
      r.trip_id,
      r.trip_type,
      r.requested_at,
      r.pickup_at,
      r.dropoff_at,
      r.surge_multiplier,
      r.rider_rating,
      r.driver_rating,
      r.fare_amount AS total_fare_amount,
      r.tip_amount AS total_tip_amount,
      r.distance_km AS total_distance_km,
      r.duration_minutes AS total_duration_minutes,
      r.rider_rating AS avg_rider_rating,
      COALESCE(d1.driver_profiles_sk, '-1') AS driver_sk,
      COALESCE(d2.rider_profiles_sk, '-1') AS rider_sk,
      COALESCE(d3.city_master_sk, '-1') AS city_sk,
      COALESCE(d4.payment_method_sk, '-1') AS payment_method_sk,
      CAST(r.dropoff_at AS DATE) AS dropoff_date
    FROM source r
    LEFT JOIN gold_dim_driver_profiles d1
      ON  r.driver_id = d1.driver_id
      AND r.dropoff_at >= d1.effective_from
      AND r.dropoff_at < COALESCE(d1.effective_to, CAST('9999-12-31 00:00:00' AS TIMESTAMP))
    LEFT JOIN gold_dim_rider_profiles d2
      ON  r.rider_id = d2.rider_id
      AND r.dropoff_at >= d2.effective_from
      AND r.dropoff_at < COALESCE(d2.effective_to, CAST('9999-12-31 00:00:00' AS TIMESTAMP))
    LEFT JOIN gold_dim_city_master d3
      ON  r.city_code = d3.city_code
      AND r.dropoff_at >= d3.effective_from
      AND r.dropoff_at < COALESCE(d3.effective_to, CAST('9999-12-31 00:00:00' AS TIMESTAMP))
    LEFT JOIN gold_dim_payment_method d4
      ON  r.payment_method = d4.payment_method_code
- phase: pre
  derive:
    field: system
    sql: '''rideflow'''

links:
- name: gold_dim_driver_profiles
  type: table
  path: table:{gold_root}.{gold_layer}_dim_driver_profiles
- name: gold_dim_rider_profiles
  type: table
  path: table:{gold_root}.{gold_layer}_dim_rider_profiles
- name: gold_dim_city_master
  type: table
  path: table:`{domain_catalog_prefix}_reference`.{gold_layer}.{gold_layer}_dim_city_master
- name: gold_dim_payment_method
  type: table
  path: table:`{domain_catalog_prefix}_reference`.{gold_layer}.{gold_layer}_dim_payment_method

upstream:
- gold_dim_city_master
- gold_dim_driver_profiles
- gold_dim_payment_method
- gold_dim_rider_profiles

materialization:
  strategy: append
  fact:
    type: transaction
  partition_by:
  - dropoff_date

source:
  type: table
  path: table:{silver_root}.{silver_layer}_rideflow_trip_completed
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
