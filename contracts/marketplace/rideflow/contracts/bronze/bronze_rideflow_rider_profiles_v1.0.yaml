version: 1.0.0

info:
  title: "Bronze \u2014 RideFlow Rider Profiles"
  table_name: '{bronze_layer}_{system}_rider_profiles'
  description: 'Raw rider profile data from the RideFlow platform. Contains rider
    PII including name, email, phone, date of birth, and address.

    '
  target_layer: bronze
  domain: marketplace
  system: rideflow

model:
  fields:
  - name: RIDER_ID
    type: string
    description: Unique rider identifier
  - name: NAME
    type: string
    description: Rider full name
    pii: true
  - name: EMAIL
    type: string
    description: Rider email address
    pii: true
  - name: PHONE
    type: string
    description: Rider phone number
    pii: true
  - name: DATE_OF_BIRTH
    type: string
    description: Rider date of birth
    pii: true
  - name: HOME_ADDRESS
    type: string
    description: Rider home address
    pii: true
  - name: CITY_CODE
    type: string
    description: Primary city
  - name: SIGNUP_DATE
    type: string
    description: Account creation date
  - name: STATUS
    type: string
    description: active, inactive, suspended
  - name: PREFERRED_PAYMENT_METHOD
    type: string
    description: card, apple_pay, google_pay, cash
  - name: UPDATED_AT
    type: string
    description: Last profile update timestamp
  - name: _LAKELOGIC_PROCESSED_AT
    type: timestamp
    description: Timestamp of when this record was processed by lakelogic

source:
  type: table
  path: table:{catalog}.LANDING.{system}_rider_profiles
  load_mode: full
