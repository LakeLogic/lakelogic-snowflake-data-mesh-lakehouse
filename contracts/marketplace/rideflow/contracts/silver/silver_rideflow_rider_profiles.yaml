version: 1.0.0

info:
  title: Silver — Rideflow Rider Profiles
  target_layer: silver
  description: Rider account records from the Rideflow marketplace, one row per rider,
    linking each person to their trips, payments and support history. The profile
    carries personal data — full name, email address, phone number, date of birth
    and home address — alongside the city code they are associated with, the date
    they signed up and their current account status. Preferred payment method and
    the timestamp of the last profile change support billing and keep the record's
    currency visible.
  table_name: '{silver_layer}_rideflow_rider_profiles'
  system: rideflow
  domain: marketplace

model:
  fields:
  - name: rider_id
    type: string
    required: true
    description: Unique identifier for each rider in the Rideflow marketplace. Used
      to link a rider to their trips, payments and support history.
  - name: name
    type: string
    required: false
    pii: true
    classification: person_name
    description: The rider's full name as provided at sign-up. Personal data used
      for account identification and customer communication.
  - name: email
    type: string
    required: false
    pii: true
    classification: email
    description: The rider's email address, used for account access, receipts and
      service notifications. Personal data that should be handled with care.
  - name: phone
    type: string
    required: false
    pii: true
    classification: phone
    description: The rider's contact phone number, used for trip coordination and
      account verification. Personal data that should be handled with care.
  - name: date_of_birth
    type: string
    required: false
    pii: true
    classification: date_of_birth
    description: The rider's date of birth, used for age-related eligibility and account
      verification. Personal data that should be handled with care.
  - name: home_address
    type: string
    required: false
    pii: true
    classification: postal_address
    description: The rider's home address, used for billing and service coverage checks.
      Personal data that should be handled with care.
  - name: city_code
    type: string
    required: false
    description: Short code for the city the rider is associated with. Supports regional
      reporting and local service operations.
  - name: signup_date
    type: date
    required: false
    description: The date the rider created their Rideflow account. Useful for tracking
      rider growth and cohort analysis.
  - name: status
    type: string
    required: true
    description: Current state of the rider's account, such as active or inactive.
      Helps teams understand who can currently use the service.
  - name: preferred_payment_method
    type: string
    required: false
    description: The payment method the rider prefers to use for trips. Supports billing
      operations and payment experience improvements.
  - name: updated_at
    type: timestamp
    required: false
    description: Timestamp of the most recent change to the rider's profile record.
      Indicates how current the information is.

primary_key:
- rider_id

quality:
  row_rules:
  - name: rider_id_not_null
    sql: rider_id IS NOT NULL
    category: completeness
    description: rider_id is always present (never null).
  - name: preferred_payment_method_accepted_values
    sql: preferred_payment_method IS NULL OR preferred_payment_method IN ('apple_pay',
      'bank_transfer', 'credit_card', 'debit_card', 'google_pay', 'paypal')
    category: validity
    description: 'preferred_payment_method is one of: apple_pay, bank_transfer, credit_card,
      debit_card, google_pay, paypal when present.'
  - name: status_not_null
    sql: status IS NOT NULL
    category: completeness
    description: status is always present (never null).
  - name: status_accepted_values
    sql: status IS NULL OR status IN ('active', 'deleted', 'inactive', 'pending',
      'suspended')
    category: validity
    description: 'status is one of: active, deleted, inactive, pending, suspended
      when present.'

transformations:
- deduplicate:
    by:
    - rider_id
    sort_by:
    - updated_at
    order: desc

dataset: silver_rideflow_rider_profiles

source:
  type: table
  path: table:{bronze_root}.{bronze_layer}_rideflow_rider_profiles
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
