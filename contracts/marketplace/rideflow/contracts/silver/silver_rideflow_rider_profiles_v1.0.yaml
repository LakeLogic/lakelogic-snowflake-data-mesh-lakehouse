version: 1.0.0

info:
  title: "Silver \u2014 Rideflow Rider Profiles"
  table_name: '{silver_layer}_rideflow_rider_profiles'
  description: Cleaned, typed, and deduplicated data.
  target_layer: silver
  domain: marketplace
  system: rideflow

primary_key:
- RIDER_ID

model:
  fields:
  - name: RIDER_ID
    type: string
    required: true
  - name: NAME
    type: string
    pii: true
    masking: redact
  - name: EMAIL
    type: string
    pii: true
    masking: hash
  - name: PHONE
    type: string
    pii: true
    masking: hash
  - name: DATE_OF_BIRTH
    type: string
    pii: true
    masking: hash
  - name: HOME_ADDRESS
    type: string
    pii: true
    masking: redact
  - name: CITY_CODE
    type: string
  - name: SIGNUP_DATE
    type: date
  - name: STATUS
    type: string
  - name: PREFERRED_PAYMENT_METHOD
    type: string
  - name: UPDATED_AT
    type: timestamp

quality:
  row_rules:
  - name: valid_email
    sql: email like '%@%'
  - name: rider_id_not_null
    sql: rider_id IS NOT NULL
  dataset_rules:
  - unique: RIDER_ID

transformations:
- deduplicate:
    by:
    - RIDER_ID
    sort_by:
    - RIDER_ID

source:
  type: table
  path: table:{domain_catalog}.{bronze_layer}_{system}_rider_profiles
  load_mode: full
