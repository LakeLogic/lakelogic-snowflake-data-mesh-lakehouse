version: 1.0.0

info:
  title: Bronze — Salesforce Cases
  target_layer: bronze
  table_name: '{bronze_layer}_salesforce_cases'
  domain: business
  system: salesforce

model:
  fields:
  - name: attributes
    type: json
    description: Salesforce API metadata for the record (object type and URL).
  - name: Id
    type: string
    description: Salesforce record ID; unique per record.
  - name: AccountId
    type: string
    description: Salesforce account the record belongs to.
  - name: ContactId
    type: string
    description: Salesforce contact the case is about.
  - name: CaseNumber
    type: string
    description: Case number shown to users in Salesforce.
  - name: Subject
    type: string
    description: Short summary of the case.
  - name: Status
    type: string
    description: Status of the case or contract.
  - name: Priority
    type: string
    description: Case priority.
  - name: Origin
    type: string
    description: Channel the case came in through, such as email or phone.
  - name: CreatedDate
    type: string
    description: When the record was created in Salesforce.
  - name: LastModifiedDate
    type: string
    description: When a user last changed the record in Salesforce.
  - name: SystemModstamp
    type: string
    description: When the record was last changed by a user or by Salesforce itself.
  - name: ClosedDate
    type: string
    description: When the case was closed.
  - name: IsDeleted
    type: boolean
    description: Whether the record is in the Salesforce recycle bin.

source:
  type: landing
  path: '{landing_root}/cases'
  format: json
  partition:
    format: y_%Y/m_%m/d_%d
  load_mode: incremental
  watermark_strategy: pipeline_log

primary_key:
- Id

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'

dataset: bronze_salesforce_cases
