version: 1.0.0

info:
  title: Bronze — Salesforce Contracts
  target_layer: bronze
  table_name: '{bronze_layer}_salesforce_contracts'
  domain: business
  system: salesforce

model:
  fields:
  - name: attributes
    type: json
    description: Salesforce API metadata for the record (object type and URL).
  - name: Id
    type: string
    description: Salesforce record ID; unique per record.
  - name: AccountId
    type: string
    description: Salesforce account the record belongs to.
  - name: ContractNumber
    type: string
    description: Contract number shown to users in Salesforce.
  - name: Status
    type: string
    description: Status of the case or contract.
  - name: StartDate
    type: string
    description: Date the contract starts.
  - name: ContractTerm
    type: Int64
    description: Contract length in months.
  - name: EndDate
    type: string
    description: Date the contract ends.
  - name: RideFlow_Monthly_Commit__c
    type: Float64
    description: Monthly spend the business account has committed to (custom field).
  - name: CreatedDate
    type: string
    description: When the record was created in Salesforce.
  - name: LastModifiedDate
    type: string
    description: When a user last changed the record in Salesforce.
  - name: SystemModstamp
    type: string
    description: When the record was last changed by a user or by Salesforce itself.
  - name: IsDeleted
    type: boolean
    description: Whether the record is in the Salesforce recycle bin.

source:
  type: landing
  path: '{landing_root}/contracts'
  format: json
  partition:
    format: y_%Y/m_%m/d_%d
  load_mode: incremental
  watermark_strategy: pipeline_log

primary_key:
- Id

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'

dataset: bronze_salesforce_contracts
