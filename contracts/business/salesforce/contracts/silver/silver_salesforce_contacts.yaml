version: 1.0.0

info:
  title: Silver — Salesforce Contacts
  target_layer: silver
  table_name: '{silver_layer}_salesforce_contacts'
  system: salesforce
  domain: business

model:
  fields:
  - name: attributes
    type: json
    required: false
    description: Salesforce API metadata for the record (object type and URL).
  - name: Id
    type: string
    required: true
    description: Salesforce record ID; unique per record.
  - name: AccountId
    type: string
    required: false
    description: Salesforce account the record belongs to.
  - name: FirstName
    type: string
    required: false
    description: Contact's first name.
  - name: LastName
    type: string
    required: false
    description: Contact's last name.
  - name: Email
    type: string
    required: false
    pii: true
    classification: email
    description: Contact's email address.
  - name: Title
    type: string
    required: false
    description: Contact's job title.
  - name: Phone
    type: string
    required: false
    pii: true
    classification: phone
    description: Contact's phone number.
  - name: MailingCity
    type: string
    required: false
    description: City of the contact's mailing address.
  - name: CreatedDate
    type: timestamp
    required: false
    description: When the record was created in Salesforce.
  - name: LastModifiedDate
    type: timestamp
    required: false
    description: When a user last changed the record in Salesforce.
  - name: SystemModstamp
    type: timestamp
    required: false
    description: When the record was last changed by a user or by Salesforce itself.
  - name: IsDeleted
    type: boolean
    required: false
    description: Whether the record is in the Salesforce recycle bin.

primary_key:
- Id

quality:
  row_rules:
  - name: Id_not_null
    sql: Id IS NOT NULL
    category: completeness
    description: id is always present (never null).

transformations:
- deduplicate:
    by:
    - Id
    sort_by:
    - LastModifiedDate
    order: desc

dataset: silver_salesforce_contacts

source:
  type: table
  path: table:{bronze_root}.{bronze_layer}_salesforce_contacts
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
