version: 1.0.0

info:
  title: Silver — Salesforce Opportunities
  target_layer: silver
  table_name: '{silver_layer}_salesforce_opportunities'
  system: salesforce
  domain: business

model:
  fields:
  - name: attributes
    type: json
    required: false
    description: Salesforce API metadata for the record (object type and URL).
  - name: Id
    type: string
    required: true
    description: Salesforce record ID; unique per record.
  - name: AccountId
    type: string
    required: false
    description: Salesforce account the record belongs to.
  - name: Name
    type: string
    required: false
    pii: true
    classification: person_name
    description: Name of the account or opportunity.
  - name: StageName
    type: string
    required: true
    description: Sales stage of the opportunity.
  - name: Probability
    type: Int64
    required: false
    description: Likelihood of winning the opportunity, in percent.
  - name: Amount
    type: decimal(18,2)
    required: false
    description: Opportunity value.
  - name: CloseDate
    type: date
    required: false
    description: Expected or actual close date of the opportunity.
  - name: LeadSource
    type: string
    required: false
    description: Where the opportunity's lead came from.
  - name: OwnerId
    type: string
    required: false
    description: Salesforce user who owns the record.
  - name: CreatedDate
    type: timestamp
    required: false
    description: When the record was created in Salesforce.
  - name: LastModifiedDate
    type: timestamp
    required: false
    description: When a user last changed the record in Salesforce.
  - name: SystemModstamp
    type: timestamp
    required: false
    description: When the record was last changed by a user or by Salesforce itself.
  - name: IsDeleted
    type: boolean
    required: false
    description: Whether the record is in the Salesforce recycle bin.

primary_key:
- Id

quality:
  row_rules:
  - name: Id_not_null
    sql: Id IS NOT NULL
    category: completeness
    description: id is always present (never null).
  - name: Amount_range_min
    sql: Amount IS NULL OR Amount >= 0
    category: validity
    description: Amount is at least 0 when present.
  - name: Amount_range_max
    sql: Amount IS NULL OR Amount <= 1000000000
    category: validity
    description: Amount is at most 1000000000 when present.
  - name: StageName_not_null
    sql: StageName IS NOT NULL
    category: completeness
    description: stagename is always present (never null).

transformations:
- deduplicate:
    by:
    - Id
    sort_by:
    - LastModifiedDate
    order: desc

dataset: silver_salesforce_opportunities

source:
  type: table
  path: table:{bronze_root}.{bronze_layer}_salesforce_opportunities
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
