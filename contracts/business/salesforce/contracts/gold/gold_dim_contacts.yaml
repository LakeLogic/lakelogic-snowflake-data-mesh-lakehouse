version: 1.0.0

info:
  title: Gold — Dim Contacts (SCD2)
  target_layer: gold
  description: 'grain: one row per Salesforce contact'
  table_name: '{gold_layer}_dim_contacts'
  system: salesforce
  domain: business

model:
  fields:
  - name: contacts_sk
    type: string
    required: false
    description: 'Surrogate key: sha256 of the business key and the version start,
      written by the materializer; ''-1'' is the unknown member.'
  - name: Id
    type: string
    required: true
    description: Salesforce record ID; unique per record.
  - name: AccountId
    type: string
    required: false
    description: Salesforce account the record belongs to.
  - name: FirstName
    type: string
    required: false
    description: Contact's first name.
  - name: LastName
    type: string
    required: false
    description: Contact's last name.
  - name: Title
    type: string
    required: false
    description: Contact's job title.
  - name: MailingCity
    type: string
    required: false
    description: City of the contact's mailing address.
  - name: effective_from
    type: timestamp
    required: false
    description: SCD2 effective from, written by the materializer.
  - name: effective_to
    type: timestamp
    required: false
    description: SCD2 effective to, written by the materializer.
  - name: is_current
    type: boolean
    required: false
    description: SCD2 current flag, written by the materializer.
  - name: version_number
    type: long
    required: false
    description: SCD2 version column, written by the materializer.
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_dim_contacts

primary_key:
- Id

materialization:
  strategy: scd2
  scd2:
    surrogate_key: contacts_sk
    surrogate_key_strategy: hash
    effective_from_field: effective_from
    effective_to_field: effective_to
    current_flag_field: is_current
    version_column: version_number
    track_columns:
    - AccountId
    - Title
    - MailingCity
    unknown_member:
      enabled: true
      surrogate_key_value: '-1'

quality:
  dataset_rules:
  - unique:
      columns:
      - Id
      - effective_from
      name: Id_effective_from_unique
      category: uniqueness
      description: No two rows share the same Id, effective_from.

source:
  type: table
  path: table:{silver_root}.{silver_layer}_salesforce_contacts
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'

transformations:
- phase: pre
  derive:
    field: system
    sql: '''salesforce'''
