version: 1.0.0

info:
  title: Gold — Fact Campaigns Daily (Meta Ads)
  target_layer: gold
  description: 'grain: one row per day'
  table_name: '{gold_layer}_meta_ads_fact_campaigns_daily'
  system: meta_ads
  domain: marketing

model:
  fields:
  - name: activity_date
    type: date
    required: true
    description: Calendar day the row summarises.
  - name: impressions
    type: integer
    required: false
    description: How many times the campaign's ads were shown to people. A key measure
      of reach and visibility.
  - name: clicks
    type: integer
    required: false
    description: How many times people clicked on the campaign's ads. Indicates engagement
      and interest.
  - name: spend
    type: decimal(18,2)
    required: false
    description: The amount of money spent on the campaign, in the account currency.
      Core input for cost and return calculations.
  - name: conversions
    type: integer
    required: false
    description: The number of valuable actions (such as purchases or sign-ups) attributed
      to the campaign. Central to measuring marketing effectiveness.
  - name: date_key
    type: integer
    required: false
    foreign_key:
      contract: gold_dim_date
      column: date_key
    description: The day of activity_date as YYYYMMDD — the key of the date dimension.
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_meta_ads_fact_campaigns_daily

primary_key:
- activity_date

quality:
  dataset_rules:
  - unique:
      columns:
      - activity_date
      name: activity_date_unique
      category: uniqueness
      description: No two rows share the same activity_date.

transformations:
- phase: pre
  sql: |-
    WITH touched AS (
      SELECT DISTINCT
        CAST(date AS DATE) AS _touched_0
      FROM source
    ),
    r AS (
      SELECT
        CAST(date AS DATE) AS activity_date,
        SUM(impressions) AS impressions,
        SUM(clicks) AS clicks,
        SUM(spend) AS spend,
        SUM(conversions) AS conversions
      FROM silver_meta_ads_campaigns_full
      JOIN touched
        ON CAST(date AS DATE) = touched._touched_0
      GROUP BY CAST(date AS DATE)
    )
    SELECT
      r.activity_date,
      r.impressions,
      r.clicks,
      r.spend,
      r.conversions,
      CAST(EXTRACT(YEAR FROM r.activity_date) AS BIGINT) * 10000 + CAST(EXTRACT(MONTH FROM r.activity_date) AS BIGINT) * 100 + CAST(EXTRACT(DAY FROM r.activity_date) AS BIGINT) AS date_key
    FROM r
- phase: pre
  derive:
    field: system
    sql: '''meta_ads'''

links:
- name: silver_meta_ads_campaigns_full
  type: table
  path: table:{silver_root}.{silver_layer}_meta_ads_campaigns

upstream: []

materialization:
  fact:
    type: aggregate

source:
  type: table
  path: table:{silver_root}.{silver_layer}_meta_ads_campaigns
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
