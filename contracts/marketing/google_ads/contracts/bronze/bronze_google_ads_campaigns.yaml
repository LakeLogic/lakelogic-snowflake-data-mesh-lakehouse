version: 1.0.0

info:
  title: Bronze — Google Ads Campaigns
  target_layer: bronze
  description: Daily Google Ads campaign and ad group performance, showing impressions,
    clicks, spend and the conversions and conversion value attributed to each campaign,
    with cost and conversion value recorded in a stated currency. Records are keyed
    by campaign identifier and dated by the day the figures relate to, with campaign
    and ad group names carried alongside for recognition in reports. The source system
    is Google Ads, landing as found in the bronze layer.
  table_name: '{bronze_layer}_google_ads_campaigns'
  domain: marketing
  system: google_ads

model:
  fields:
  - name: campaign_id
    type: string
    description: Unique identifier for the advertising campaign, used to link performance
      data back to the campaign that generated it.
  - name: campaign_name
    type: string
    description: The human-readable name of the advertising campaign, making it easy
      to recognise in reports.
  - name: ad_group_id
    type: string
    description: Unique identifier for the ad group within a campaign, used to group
      related ads and targeting together.
  - name: ad_group_name
    type: string
    description: The human-readable name of the ad group, showing how ads are organised
      within a campaign.
  - name: date
    type: string
    description: The day the performance figures relate to, allowing trends to be
      tracked over time.
  - name: impressions
    type: string
    description: How many times the ads were shown to potential customers.
  - name: clicks
    type: string
    description: How many times people clicked on the ads.
  - name: cost
    type: Float64
    description: The amount of money spent on the ads for the period.
  - name: conversions
    type: string
    description: The number of valuable actions (such as purchases or sign-ups) attributed
      to the ads.
  - name: conversion_value
    type: Float64
    description: The monetary value of the conversions generated by the ads.
  - name: currency
    type: string
    description: The currency in which cost and conversion value are recorded.

source:
  type: landing
  path: '{landing_root}/campaigns'
  format: csv
  partition:
    format: y_%Y/m_%m/d_%d/h_%H
  load_mode: incremental
  watermark_strategy: pipeline_log

primary_key:
- campaign_id
- ad_group_id
- date

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'

dataset: bronze_google_ads_campaigns
