version: 1.0.0

info:
  title: Silver — Google Ads Campaigns
  target_layer: silver
  description: Daily performance figures for Google Ads campaigns, broken down by
    ad group and showing impressions, clicks, spend, conversions and the monetary
    value of those conversions, with amounts recorded in a stated currency. Each record
    ties back to the campaign and ad group that generated it, and carries the date
    the figures relate to so trends can be followed over time.
  table_name: '{silver_layer}_google_ads_campaigns'
  system: google_ads
  domain: marketing

model:
  fields:
  - name: campaign_id
    type: string
    required: true
    description: Unique identifier for the advertising campaign, used to link performance
      data back to the campaign that generated it.
  - name: campaign_name
    type: string
    required: true
    description: The human-readable name of the advertising campaign, making it easy
      to recognise in reports.
  - name: ad_group_id
    type: string
    required: true
    description: Unique identifier for the ad group within a campaign, used to group
      related ads and targeting together.
  - name: ad_group_name
    type: string
    required: true
    description: The human-readable name of the ad group, showing how ads are organised
      within a campaign.
  - name: date
    type: date
    required: true
    description: The day the performance figures relate to, allowing trends to be
      tracked over time.
  - name: impressions
    type: integer
    required: false
    description: How many times the ads were shown to potential customers.
  - name: clicks
    type: integer
    required: false
    description: How many times people clicked on the ads.
  - name: cost
    type: decimal(18,2)
    required: false
    description: The amount of money spent on the ads for the period.
  - name: conversions
    type: integer
    required: false
    description: The number of valuable actions (such as purchases or sign-ups) attributed
      to the ads.
  - name: conversion_value
    type: decimal(18,2)
    required: false
    description: The monetary value of the conversions generated by the ads.
  - name: currency
    type: string
    required: false
    description: The currency in which cost and conversion value are recorded.

primary_key:
- campaign_id
- ad_group_id
- date

quality:
  row_rules:
  - name: campaign_id_not_null
    sql: campaign_id IS NOT NULL
    category: completeness
    description: campaign_id is always present (never null).
  - name: ad_group_id_not_null
    sql: ad_group_id IS NOT NULL
    category: completeness
    description: ad_group_id is always present (never null).
  - name: date_not_null
    sql: date IS NOT NULL
    category: completeness
    description: date is always present (never null).
  - name: ad_group_name_not_null
    sql: ad_group_name IS NOT NULL
    category: completeness
    description: ad_group_name is always present (never null).
  - name: campaign_name_not_null
    sql: campaign_name IS NOT NULL
    category: completeness
    description: campaign_name is always present (never null).
  - name: clicks_range_min
    sql: clicks IS NULL OR clicks >= 0
    category: validity
    description: clicks is at least 0 when present.
  - name: clicks_range_max
    sql: clicks IS NULL OR clicks <= 1000000000
    category: validity
    description: clicks is at most 1000000000 when present.
  - name: conversion_value_range_min
    sql: conversion_value IS NULL OR conversion_value >= 0
    category: validity
    description: conversion_value is at least 0 when present.
  - name: conversion_value_range_max
    sql: conversion_value IS NULL OR conversion_value <= 1000000
    category: validity
    description: conversion_value is at most 1000000 when present.
  - name: conversions_range_min
    sql: conversions IS NULL OR conversions >= 0
    category: validity
    description: conversions is at least 0 when present.
  - name: conversions_range_max
    sql: conversions IS NULL OR conversions <= 100000000
    category: validity
    description: conversions is at most 100000000 when present.
  - name: cost_range_min
    sql: cost IS NULL OR cost >= 0
    category: validity
    description: cost is at least 0 when present.
  - name: cost_range_max
    sql: cost IS NULL OR cost <= 1000000
    category: validity
    description: cost is at most 1000000 when present.
  - name: currency_accepted_values
    sql: currency IS NULL OR currency IN ('AUD', 'CAD', 'CHF', 'CNY', 'EUR', 'GBP',
      'JPY', 'USD')
    category: validity
    description: 'currency is one of: AUD, CAD, CHF, CNY, EUR, GBP, JPY, USD when
      present.'
  - name: impressions_range_min
    sql: impressions IS NULL OR impressions >= 0
    category: validity
    description: impressions is at least 0 when present.
  - name: impressions_range_max
    sql: impressions IS NULL OR impressions <= 1000000000
    category: validity
    description: impressions is at most 1000000000 when present.

transformations:
- deduplicate:
    by:
    - campaign_id
    - ad_group_id
    - date
    sort_by:
    - _lakelogic_processed_at
    order: desc

dataset: silver_google_ads_campaigns

source:
  type: table
  path: table:{bronze_root}.{bronze_layer}_google_ads_campaigns
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
