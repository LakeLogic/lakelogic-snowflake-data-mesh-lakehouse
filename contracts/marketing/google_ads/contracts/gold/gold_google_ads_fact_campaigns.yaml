version: 1.0.0

info:
  title: Gold — Fact Campaigns (Google Ads)
  target_layer: gold
  description: Daily advertising performance figures from Google Ads, broken down
    by campaign and ad group, covering impressions, clicks, spend and the number and
    monetary value of conversions attributed to the ads. Amounts are expressed in
    a linked currency so spend and conversion value can be compared and reported consistently,
    and each record carries the source system it originated from.
  table_name: '{gold_layer}_google_ads_fact_campaigns'
  system: google_ads
  domain: marketing

model:
  fields:
  - name: campaign_id
    type: string
    required: true
    description: Unique identifier for the advertising campaign, used to link performance
      data back to the campaign that generated it.
  - name: ad_group_id
    type: string
    required: true
    description: Unique identifier for the ad group within a campaign, used to group
      related ads and targeting together.
  - name: date
    type: date
    required: true
    description: The day the performance figures relate to, allowing trends to be
      tracked over time.
  - name: impressions
    type: integer
    required: false
    description: How many times the ads were shown to potential customers.
  - name: clicks
    type: integer
    required: false
    description: How many times people clicked on the ads.
  - name: cost
    type: decimal(18,2)
    required: false
    description: The amount of money spent on the ads for the period.
  - name: conversions
    type: integer
    required: false
    description: The number of valuable actions (such as purchases or sign-ups) attributed
      to the ads.
  - name: conversion_value
    type: decimal(18,2)
    required: false
    description: The monetary value of the conversions generated by the ads.
  - name: campaign_name
    type: string
    required: false
    description: The human-readable name of the advertising campaign, making it easy
      to recognise in reports.
  - name: ad_group_name
    type: string
    required: false
    description: The human-readable name of the ad group, showing how ads are organised
      within a campaign.
  - name: currency
    type: string
    required: false
    description: The currency in which cost and conversion value are recorded.
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_google_ads_fact_campaigns

primary_key:
- campaign_id
- ad_group_id
- date

quality:
  dataset_rules:
  - unique:
      columns:
      - campaign_id
      - ad_group_id
      - date
      name: campaign_id_ad_group_id_date_unique
      category: uniqueness
      description: No two rows share the same campaign_id, ad_group_id, date.

transformations:
- phase: pre
  sql: |-
    SELECT
      r.campaign_id,
      r.ad_group_id,
      r.date,
      r.campaign_name,
      r.ad_group_name,
      r.currency,
      r.impressions AS impressions,
      r.clicks AS clicks,
      r.cost AS cost,
      r.conversions AS conversions,
      r.conversion_value AS conversion_value
    FROM source r
- phase: pre
  derive:
    field: system
    sql: '''google_ads'''

materialization:
  strategy: append
  fact:
    type: transaction

source:
  type: table
  path: table:{silver_root}.{silver_layer}_google_ads_campaigns
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
