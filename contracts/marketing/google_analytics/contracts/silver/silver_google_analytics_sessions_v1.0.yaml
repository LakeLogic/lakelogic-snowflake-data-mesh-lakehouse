version: 1.0.0

info:
  title: "Silver \u2014 Google Analytics Sessions"
  table_name: '{silver_layer}_google_analytics_sessions'
  description: Cleaned, typed, and deduplicated data.
  target_layer: silver
  domain: marketing
  system: google_analytics

model:
  fields:
  - name: SESSION_ID
    type: string
    required: true
  - name: USER_PSEUDO_ID
    type: string
    required: true
  - name: USER_ID
    type: string
    pii: true
    masking: hash
  - name: IP_ADDRESS
    type: string
    pii: true
    masking: redact
  - name: SESSION_START
    type: string
  - name: SESSION_DURATION_SECONDS
    type: integer
  - name: PAGE_VIEWS
    type: string
  - name: TRAFFIC_SOURCE
    type: string
  - name: TRAFFIC_MEDIUM
    type: string
  - name: TRAFFIC_CAMPAIGN
    type: string
  - name: DEVICE_CATEGORY
    type: string
  - name: GEO_COUNTRY
    type: string
  - name: LANDING_PAGE
    type: string

primary_key:
- SESSION_ID

quality:
  row_rules: []
  dataset_rules:
  - unique: SESSION_ID

transformations:
- deduplicate:
    by:
    - SESSION_ID
    sort_by:
    - SESSION_ID

source:
  type: table
  path: table:{domain_catalog}.{bronze_layer}_{system}_sessions
  load_mode: full
