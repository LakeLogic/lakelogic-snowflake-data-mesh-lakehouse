version: 1.0.0

info:
  title: Gold — Fact Sessions
  target_layer: gold
  description: Sessions record individual visits to the website, capturing how long
    each visit lasted, how many pages were viewed, and when it began, alongside the
    traffic source, medium and named campaign that brought the visitor in. Each visit
    is tied to an anonymised visitor identifier and, where the person was signed in,
    a customer identifier, with the device type, country and landing page recorded
    for audience analysis. Records originate from Google Analytics and are enriched
    with internal references to country and device type reference data, with a placeholder
    used where either is unrecognised.
  table_name: '{gold_layer}_fact_sessions'
  system: google_analytics
  domain: marketing

model:
  fields:
  - name: session_id
    type: string
    required: true
    description: Unique identifier for a single visit to the website; used to group
      all activity that happened within one session.
  - name: session_duration_seconds
    type: integer
    required: false
    description: How long the visit lasted in seconds, a signal of how engaging the
      experience was.
  - name: page_views
    type: integer
    required: false
    description: The number of pages the visitor looked at during the session, showing
      depth of interest.
  - name: user_pseudo_id
    type: string
    required: false
    description: An anonymised identifier for the visitor, letting us recognise repeat
      visits from the same person without knowing who they are.
  - name: user_id
    type: string
    required: false
    description: The logged-in customer identifier when a visitor is signed in, linking
      their website activity to their known account.
  - name: session_start
    type: timestamp
    required: false
    description: The date and time the visit began, used to understand when and how
      often customers engage with us.
  - name: traffic_source
    type: string
    required: false
    description: The website or platform that referred the visitor, showing where
      our audience comes from.
  - name: traffic_medium
    type: string
    required: false
    description: The channel type that brought the visitor (for example organic search,
      paid ads or email), helping us judge which marketing channels work.
  - name: traffic_campaign
    type: string
    required: false
    description: The named marketing campaign that drove the visit, used to measure
      campaign performance.
  - name: landing_page
    type: string
    required: false
    description: The first page the visitor arrived on, showing which entry points
      attract and hold attention.
  - name: device_category_sk
    type: string
    required: true
    foreign_key:
      contract: gold_dim_device_category
      column: device_category_sk
    description: Surrogate key of gold_dim_device_category, looked up on its business
      key; '-1' when the dimension does not know the row.
  - name: geo_country_sk
    type: string
    required: true
    foreign_key:
      contract: gold_dim_geo_country
      column: geo_country_sk
    description: Surrogate key of gold_dim_geo_country, looked up on its business
      key; '-1' when the dimension does not know the row.
  - name: session_start_date
    type: date
    required: false
    description: 'Partition column: the calendar date of `session_start`.'
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_fact_sessions

primary_key:
- session_id

quality:
  dataset_rules:
  - unique:
      columns:
      - session_id
      name: session_id_unique
      category: uniqueness
      description: No two rows share the same session_id.
  - name: device_category_sk_unknown_member_rows
    sql: SELECT COUNT(*) FROM {dataset} WHERE device_category_sk = '-1'
    must_be_less_than: 1
    severity: warning
    category: consistency
    description: Rows whose device_category_sk fell back to the unknown member — the
      dimension did not know them when this fact ran.
  - name: geo_country_sk_unknown_member_rows
    sql: SELECT COUNT(*) FROM {dataset} WHERE geo_country_sk = '-1'
    must_be_less_than: 1
    severity: warning
    category: consistency
    description: Rows whose geo_country_sk fell back to the unknown member — the dimension
      did not know them when this fact ran.

transformations:
- phase: pre
  sql: |-
    SELECT
      r.session_id,
      r.user_pseudo_id,
      r.user_id,
      r.session_start,
      r.traffic_source,
      r.traffic_medium,
      r.traffic_campaign,
      r.landing_page,
      r.session_duration_seconds AS session_duration_seconds,
      r.page_views AS page_views,
      COALESCE(d1.device_category_sk, '-1') AS device_category_sk,
      COALESCE(d2.geo_country_sk, '-1') AS geo_country_sk,
      CAST(r.session_start AS DATE) AS session_start_date
    FROM source r
    LEFT JOIN gold_dim_device_category d1
      ON  r.device_category = d1.device_category
    LEFT JOIN gold_dim_geo_country d2
      ON  r.geo_country = d2.geo_country
- phase: pre
  derive:
    field: system
    sql: '''google_analytics'''

links:
- name: gold_dim_device_category
  type: table
  path: table:{gold_root}.{gold_layer}_dim_device_category
- name: gold_dim_geo_country
  type: table
  path: table:{gold_root}.{gold_layer}_dim_geo_country

upstream:
- gold_dim_device_category
- gold_dim_geo_country

materialization:
  strategy: append
  fact:
    type: transaction
  partition_by:
  - session_start_date

source:
  type: table
  path: table:{silver_root}.{silver_layer}_google_analytics_sessions
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
