version: 1.0.0

info:
  title: Silver — Hubspot Email Campaigns
  target_layer: silver
  description: Email campaign performance records from HubSpot, one row per recipient
    per campaign, capturing who was sent each mailing along with their email address
    and name as personal contact data. Each record traces the recipient's engagement
    timeline from send time through opens and link clicks, and flags whether the message
    bounced or the recipient unsubscribed. Campaign identifiers, names and subject
    lines let the business group and compare results across mailings.
  table_name: '{silver_layer}_hubspot_email_campaigns'
  system: hubspot
  domain: marketing

model:
  fields:
  - name: campaign_id
    type: string
    required: true
    description: Unique identifier for the email campaign this record belongs to.
      Used to group and compare performance across campaigns.
  - name: recipient_email
    type: string
    required: true
    pii: true
    classification: email
    description: Email address of the person who received the campaign. Personal contact
      data used for delivery and engagement tracking.
  - name: recipient_name
    type: string
    required: false
    description: Name of the person who received the campaign. Helps personalize reporting
      and identify who engaged.
  - name: campaign_name
    type: string
    required: true
    description: Human-readable name of the email campaign. Makes it easy to recognize
      and report on campaigns.
  - name: subject_line
    type: string
    required: false
    description: The subject line shown in the recipient's inbox. Key driver of whether
      the email gets opened.
  - name: sent_at
    type: timestamp
    required: false
    description: Date and time the email was sent to the recipient. Marks the start
      of that recipient's engagement timeline.
  - name: opened_at
    type: timestamp
    required: false
    description: Date and time the recipient opened the email, if they did. Indicates
      initial interest in the message.
  - name: clicked_at
    type: timestamp
    required: false
    description: Date and time the recipient clicked a link in the email, if they
      did. Shows deeper engagement than an open.
  - name: bounced
    type: boolean
    required: false
    description: Whether the email failed to reach the recipient. High bounce rates
      signal list quality or deliverability issues.
  - name: unsubscribed
    type: boolean
    required: false
    description: Whether the recipient opted out of future emails after this campaign.
      Tracks list health and audience loss.

primary_key:
- campaign_id
- recipient_email

quality:
  row_rules:
  - name: campaign_id_not_null
    sql: campaign_id IS NOT NULL
    category: completeness
    description: campaign_id is always present (never null).
  - name: recipient_email_not_null
    sql: recipient_email IS NOT NULL
    category: completeness
    description: recipient_email is always present (never null).
  - name: campaign_name_not_null
    sql: campaign_name IS NOT NULL
    category: completeness
    description: campaign_name is always present (never null).

transformations:
- deduplicate:
    by:
    - campaign_id
    - recipient_email
    sort_by:
    - sent_at
    order: desc

dataset: silver_hubspot_email_campaigns

source:
  type: table
  path: table:{bronze_root}.{bronze_layer}_hubspot_email_campaigns
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
