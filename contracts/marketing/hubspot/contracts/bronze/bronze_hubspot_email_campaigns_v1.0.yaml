version: 1.0.0

info:
  title: "Bronze \u2014 HubSpot Email Campaigns"
  table_name: '{bronze_layer}_{system}_email_campaigns'
  description: 'Raw email campaign send and engagement data from HubSpot.

    '
  target_layer: bronze
  domain: marketing
  system: hubspot

model:
  fields:
  - name: CAMPAIGN_ID
    type: string
    description: HubSpot campaign ID
  - name: RECIPIENT_EMAIL
    type: string
    pii: true
    description: Recipient email address
  - name: RECIPIENT_NAME
    type: string
    pii: true
    description: Recipient display name
  - name: CAMPAIGN_NAME
    type: string
    description: Campaign name
  - name: SUBJECT_LINE
    type: string
    description: Email subject line
  - name: SENT_AT
    type: string
    description: Send timestamp
  - name: OPENED_AT
    type: string
    description: Open timestamp (null if not opened)
  - name: CLICKED_AT
    type: string
    description: Click timestamp (null if not clicked)
  - name: BOUNCED
    type: string
    description: true/false bounce flag
    accepted_values:
    - 'false'
    - 'false'
    - 'false'
    - 'false'
    - 'false'
    - 'false'
    - 'false'
    - 'false'
    - 'false'
    - 'false'
    - 'false'
    - 'true'
  - name: UNSUBSCRIBED
    type: string
    description: true/false unsubscribe flag
    accepted_values:
    - 'false'
    - 'false'
    - 'false'
    - 'false'
    - 'false'
    - 'false'
    - 'false'
    - 'false'
    - 'false'
    - 'false'
    - 'false'
    - 'false'
    - 'false'
    - 'false'
    - 'false'
    - 'false'
    - 'false'
    - 'false'
    - 'false'
    - 'true'

source:
  type: table
  path: table:{catalog}.LANDING.{system}_email_campaigns
  load_mode: full
