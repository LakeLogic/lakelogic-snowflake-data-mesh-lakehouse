version: 1.0.0

info:
  title: Gold — Fact Receipts Daily
  target_layer: gold
  description: 'grain: one row per day'
  table_name: '{gold_layer}_fact_receipts_daily'
  system: driver_expenses
  domain: payments

model:
  fields:
  - name: activity_date
    type: date
    required: true
    description: Calendar day the row summarises.
  - name: total_amount
    type: decimal(10,2)
    required: false
    description: 'Measure candidate: sum of ''total_amount'' (needs confirmation).'
  - name: vat_amount
    type: decimal(10,2)
    required: false
    description: 'Measure candidate: sum of ''vat_amount'' (needs confirmation).'
  - name: date_key
    type: integer
    required: false
    foreign_key:
      contract: gold_dim_date
      column: date_key
    description: The day of activity_date as YYYYMMDD — the key of the date dimension.
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_fact_receipts_daily

primary_key:
- activity_date

quality:
  dataset_rules:
  - unique:
      columns:
      - activity_date
      name: activity_date_unique
      category: uniqueness
      description: No two rows share the same activity_date.

transformations:
- phase: pre
  sql: |-
    WITH touched AS (
      SELECT DISTINCT
        CAST(receipt_time AS DATE) AS _touched_0
      FROM source
    ),
    r AS (
      SELECT
        CAST(receipt_time AS DATE) AS activity_date,
        SUM(total_amount) AS total_amount,
        SUM(vat_amount) AS vat_amount
      FROM silver_driver_expenses_receipts_full
      JOIN touched
        ON CAST(receipt_time AS DATE) = touched._touched_0
      GROUP BY CAST(receipt_time AS DATE)
    )
    SELECT
      r.activity_date,
      r.total_amount,
      r.vat_amount,
      CAST(EXTRACT(YEAR FROM r.activity_date) AS BIGINT) * 10000 + CAST(EXTRACT(MONTH FROM r.activity_date) AS BIGINT) * 100 + CAST(EXTRACT(DAY FROM r.activity_date) AS BIGINT) AS date_key
    FROM r
- phase: pre
  derive:
    field: system
    sql: '''driver_expenses'''

links:
- name: silver_driver_expenses_receipts_full
  type: table
  path: table:{silver_root}.{silver_layer}_driver_expenses_receipts

upstream: []

materialization:
  fact:
    type: aggregate

source:
  type: table
  path: table:{silver_root}.{silver_layer}_driver_expenses_receipts
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
