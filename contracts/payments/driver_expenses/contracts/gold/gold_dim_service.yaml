version: 1.0.0

info:
  title: Gold — Dim Service
  target_layer: gold
  description: 'grain: one row per service'
  table_name: '{gold_layer}_dim_service'
  system: driver_expenses
  domain: payments

model:
  fields:
  - name: service_sk
    type: string
    required: false
    description: 'Surrogate key: sha256 of the business key, written by the materializer;
      ''-1'' is the unknown member.'
  - name: service
    type: string
    required: true
    description: Service the receipt is for.
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_dim_service

primary_key:
- service

quality:
  dataset_rules:
  - unique:
      columns:
      - service
      name: service_unique
      category: uniqueness
      description: No two rows share the same service.

materialization:
  scd1:
    surrogate_key: service_sk
    surrogate_key_strategy: hash
    unknown_member:
      enabled: true
      surrogate_key_value: '-1'

transformations:
- phase: pre
  sql: |-
    SELECT DISTINCT service
    FROM source
    WHERE service IS NOT NULL
- phase: pre
  derive:
    field: system
    sql: '''driver_expenses'''

source:
  type: table
  path: table:{silver_root}.{silver_layer}_driver_expenses_receipts
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
