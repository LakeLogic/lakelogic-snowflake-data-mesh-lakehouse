version: 1.0.0

info:
  title: "Bronze \u2014 Stripe Refunds"
  table_name: '{bronze_layer}_{system}_refunds'
  description: 'Raw refund events from Stripe. One row per refund issued to a rider.

    '
  target_layer: bronze
  domain: payments
  system: stripe

model:
  fields:
  - name: REFUND_ID
    type: string
    description: Stripe refund ID
  - name: CHARGE_ID
    type: string
    description: FK to parent charge
    foreign_key:
      contract: '{bronze_layer}_{system}_charges'
      column: CHARGE_ID
  - name: RIDER_ID
    type: string
    description: FK to marketplace rider
    foreign_key:
      contract: '{bronze_layer}_rideflow_rider_profiles'
      column: RIDER_ID
  - name: AMOUNT
    type: string
    description: Refund amount in minor units
  - name: CURRENCY
    type: string
    description: ISO 4217 currency code
  - name: STATUS
    type: string
    description: Refund status (succeeded, pending, failed)
  - name: REASON
    type: string
    description: Refund reason code
  - name: REFUND_REASON
    type: string
    pii: true
    description: Free-text refund reason (may contain PII)
  - name: CREATED_AT
    type: string
    description: Refund creation timestamp

source:
  type: table
  path: table:{catalog}.LANDING.{system}_refunds
  load_mode: full
