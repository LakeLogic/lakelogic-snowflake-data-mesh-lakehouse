version: 1.0.0

info:
  title: "Silver \u2014 Stripe Refunds"
  table_name: '{silver_layer}_stripe_refunds'
  description: Cleaned, typed, and deduplicated data.
  target_layer: silver
  domain: payments
  system: stripe

model:
  fields:
  - name: REFUND_ID
    type: string
    required: true
  - name: CHARGE_ID
    type: string
    required: true
  - name: RIDER_ID
    type: string
  - name: AMOUNT
    type: float
  - name: CURRENCY
    type: string
  - name: STATUS
    type: string
  - name: REASON
    type: string
  - name: REFUND_REASON
    type: string
    pii: true
    masking: hash
  - name: CREATED_AT
    type: timestamp
    description: "ISO timestamp string \u2014 kept as string to match bronze; cast\
      \ in gold"

primary_key:
- REFUND_ID

quality:
  row_rules: []
  dataset_rules:
  - unique: REFUND_ID

transformations:
- deduplicate:
    by:
    - REFUND_ID
    sort_by:
    - REFUND_ID

source:
  type: table
  path: table:{domain_catalog}.{bronze_layer}_{system}_refunds
  load_mode: full
