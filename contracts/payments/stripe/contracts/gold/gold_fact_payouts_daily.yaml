version: 1.0.0

info:
  title: Gold — Fact Payouts Daily
  target_layer: gold
  description: Daily payout totals by calendar day, sourced from Stripe, with each
    day recorded once as the reference point for daily payout reporting. The figures
    are monetary amounts in the payout currency, used for revenue reconciliation and
    finance reporting, and each record carries a numeric date label linking it to
    the shared reporting calendar plus the originating source system for traceability.
  table_name: '{gold_layer}_fact_payouts_daily'
  system: stripe
  domain: payments

model:
  fields:
  - name: activity_date
    type: date
    required: true
    description: The calendar day this payout record belongs to; each day appears
      once, making it the primary reference point for daily payout reporting.
  - name: payout_amount
    type: decimal(18,2)
    required: false
    description: The total amount paid out for the day, in the payout currency, used
      for revenue reconciliation and finance reporting.
  - name: date_key
    type: integer
    required: false
    foreign_key:
      contract: gold_dim_date
      column: date_key
    description: The day of activity_date as YYYYMMDD — the key of the date dimension.
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_fact_payouts_daily

primary_key:
- activity_date

quality:
  dataset_rules:
  - unique:
      columns:
      - activity_date
      name: activity_date_unique
      category: uniqueness
      description: No two rows share the same activity_date.

transformations:
- phase: pre
  sql: |-
    WITH touched AS (
      SELECT DISTINCT
        CAST(created_at AS DATE) AS _touched_0
      FROM source
    ),
    r AS (
      SELECT
        CAST(created_at AS DATE) AS activity_date,
        SUM(amount) AS payout_amount
      FROM silver_stripe_payouts_full
      JOIN touched
        ON CAST(created_at AS DATE) = touched._touched_0
      GROUP BY CAST(created_at AS DATE)
    )
    SELECT
      r.activity_date,
      r.payout_amount,
      CAST(EXTRACT(YEAR FROM r.activity_date) AS BIGINT) * 10000 + CAST(EXTRACT(MONTH FROM r.activity_date) AS BIGINT) * 100 + CAST(EXTRACT(DAY FROM r.activity_date) AS BIGINT) AS date_key
    FROM r
- phase: pre
  derive:
    field: system
    sql: '''stripe'''

links:
- name: silver_stripe_payouts_full
  type: table
  path: table:{silver_root}.{silver_layer}_stripe_payouts

upstream: []

materialization:
  fact:
    type: aggregate

source:
  type: table
  path: table:{silver_root}.{silver_layer}_stripe_payouts
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
