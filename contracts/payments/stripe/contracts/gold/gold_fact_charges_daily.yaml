version: 1.0.0

info:
  title: Gold — Fact Charges Daily
  target_layer: gold
  description: Daily charge activity recorded against a calendar day, sourced from
    Stripe and carrying the monetary amount of each day's charges for measuring payment
    volume and revenue. A numeric day identifier links each row to a date dimension
    so figures can be reported by day, month or year, and a source-system field keeps
    each figure traceable to its origin.
  table_name: '{gold_layer}_fact_charges_daily'
  system: stripe
  domain: payments

model:
  fields:
  - name: activity_date
    type: date
    required: true
    description: The calendar day this charge activity is recorded against — the daily
      grain of the fact table.
  - name: charge_amount
    type: decimal(10,2)
    required: false
    description: The amount of the charge for that day, used to measure payment volume
      and revenue.
  - name: date_key
    type: integer
    required: false
    foreign_key:
      contract: gold_dim_date
      column: date_key
    description: The day of activity_date as YYYYMMDD — the key of the date dimension.
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_fact_charges_daily

primary_key:
- activity_date

quality:
  dataset_rules:
  - unique:
      columns:
      - activity_date
      name: activity_date_unique
      category: uniqueness
      description: No two rows share the same activity_date.

transformations:
- phase: pre
  sql: |-
    WITH touched AS (
      SELECT DISTINCT
        CAST(created_at AS DATE) AS _touched_0
      FROM source
    ),
    r AS (
      SELECT
        CAST(created_at AS DATE) AS activity_date,
        SUM(amount) AS charge_amount
      FROM silver_stripe_charges_full
      JOIN touched
        ON CAST(created_at AS DATE) = touched._touched_0
      GROUP BY CAST(created_at AS DATE)
    )
    SELECT
      r.activity_date,
      r.charge_amount,
      CAST(EXTRACT(YEAR FROM r.activity_date) AS BIGINT) * 10000 + CAST(EXTRACT(MONTH FROM r.activity_date) AS BIGINT) * 100 + CAST(EXTRACT(DAY FROM r.activity_date) AS BIGINT) AS date_key
    FROM r
- phase: pre
  derive:
    field: system
    sql: '''stripe'''

links:
- name: silver_stripe_charges_full
  type: table
  path: table:{silver_root}.{silver_layer}_stripe_charges

upstream: []

materialization:
  fact:
    type: aggregate

source:
  type: table
  path: table:{silver_root}.{silver_layer}_stripe_charges
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
