version: 1.0.0

info:
  title: Gold — Fact Refunds
  target_layer: gold
  description: Refunds issued against customer payments, each carrying the amount
    of money returned and the transaction currency, and linked back to the original
    charge so individual refunds can be traced and reconciled. Records also capture
    when the refund was created, the day it falls on for date-based reporting, and
    the processing status and reason behind it, alongside a link to the rider profile
    as it stood at the time. Refunds whose rider, currency, status or reason could
    not be matched carry a placeholder rather than a real reference.
  table_name: '{gold_layer}_fact_refunds'
  system: stripe
  domain: payments

model:
  fields:
  - name: refund_id
    type: string
    required: true
    description: Unique identifier for this refund. Used to trace and reconcile individual
      refunds across systems.
  - name: refunded_amount
    type: decimal(10,2)
    required: false
    description: Amount refunded.
  - name: charge_id
    type: string
    required: false
    description: The original payment charge that this refund was issued against,
      linking the refund back to the customer's payment.
  - name: created_at
    type: timestamp
    required: false
    description: When the refund was created. Stored as text, so confirm the date
      format before using it in time-based reporting.
  - name: rider_sk
    type: string
    required: true
    foreign_key:
      contract: gold_dim_rider_profiles
      column: rider_profiles_sk
    description: Surrogate key of gold_dim_rider_profiles, looked up as of created_at;
      '-1' when the dimension does not know the row.
  - name: currency_sk
    type: string
    required: true
    foreign_key:
      contract: gold_dim_currency
      column: currency_sk
    description: Surrogate key of gold_dim_currency, looked up on its business key;
      '-1' when the dimension does not know the row.
  - name: created_date
    type: date
    required: false
    description: 'Partition column: the calendar date of `created_at`.'
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_fact_refunds

primary_key:
- refund_id

quality:
  dataset_rules:
  - unique:
      columns:
      - refund_id
      name: refund_id_unique
      category: uniqueness
      description: No two rows share the same refund_id.
  - name: rider_sk_unknown_member_rows
    sql: SELECT COUNT(*) FROM {dataset} WHERE rider_sk = '-1'
    must_be_less_than: 1
    severity: warning
    category: consistency
    description: Rows whose rider_sk fell back to the unknown member — the dimension
      did not know them when this fact ran.
  - name: currency_sk_unknown_member_rows
    sql: SELECT COUNT(*) FROM {dataset} WHERE currency_sk = '-1'
    must_be_less_than: 1
    severity: warning
    category: consistency
    description: Rows whose currency_sk fell back to the unknown member — the dimension
      did not know them when this fact ran.

transformations:
- phase: pre
  sql: |-
    SELECT
      r.refund_id,
      r.charge_id,
      r.created_at,
      r.amount AS refunded_amount,
      COALESCE(d1.rider_profiles_sk, '-1') AS rider_sk,
      COALESCE(d2.currency_sk, '-1') AS currency_sk,
      CAST(r.created_at AS DATE) AS created_date
    FROM source r
    LEFT JOIN gold_dim_rider_profiles d1
      ON  r.rider_id = d1.rider_id
      AND r.created_at >= d1.effective_from
      AND r.created_at < COALESCE(d1.effective_to, CAST('9999-12-31 00:00:00' AS TIMESTAMP))
    LEFT JOIN gold_dim_currency d2
      ON  r.currency = d2.currency_code
- phase: pre
  derive:
    field: system
    sql: '''stripe'''

links:
- name: gold_dim_rider_profiles
  type: table
  path: table:`{domain_catalog_prefix}_marketplace`.{gold_layer}.{gold_layer}_dim_rider_profiles
- name: gold_dim_currency
  type: table
  path: table:`{domain_catalog_prefix}_reference`.{gold_layer}.{gold_layer}_dim_currency

upstream:
- gold_dim_currency
- gold_dim_rider_profiles

materialization:
  strategy: append
  fact:
    type: transaction
  partition_by:
  - created_date

source:
  type: table
  path: table:{silver_root}.{silver_layer}_stripe_refunds
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
