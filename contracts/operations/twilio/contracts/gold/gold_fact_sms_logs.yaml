version: 1.0.0

info:
  title: Gold — Fact Sms Logs
  target_layer: gold
  description: Individual text messages are recorded here with their unique identifier,
    the price charged to send each one, and timestamps for when it was sent and when
    delivery was confirmed. Delivery failures are captured through an error code and
    a simplified outcome of delivered, failed, in progress or unknown, alongside references
    to the detailed status and to whether the message was sent or received. Records
    originate from Twilio and are organised by the calendar day of delivery for reporting.
  table_name: '{gold_layer}_fact_sms_logs'
  system: twilio
  domain: operations

model:
  fields:
  - name: message_sid
    type: string
    required: true
    description: Unique identifier for this text message, used to trace it across
      systems and support requests.
  - name: message_price
    type: decimal(10,2)
    required: false
    description: The cost charged for sending this message, used for spend tracking
      and billing reconciliation.
  - name: message_count
    type: integer
    required: false
    description: Number of SMS messages in the row.
  - name: sent_at
    type: timestamp
    required: false
    description: Date and time the message was sent.
  - name: delivered_at
    type: timestamp
    required: false
    description: Date and time the message was confirmed delivered, useful for measuring
      delivery speed.
  - name: error_code
    type: string
    required: false
    description: Code explaining why a message failed, if it did, to help diagnose
      delivery problems.
  - name: currency_sk
    type: string
    required: true
    foreign_key:
      contract: gold_dim_currency
      column: currency_sk
    description: Surrogate key of gold_dim_currency, looked up on its business key;
      '-1' when the dimension does not know the row.
  - name: status_sk
    type: string
    required: true
    foreign_key:
      contract: gold_dim_sms_logs_status
      column: status_sk
    description: Surrogate key of gold_dim_sms_logs_status, looked up on its business
      key; '-1' when the dimension does not know the row.
  - name: direction_sk
    type: string
    required: true
    foreign_key:
      contract: gold_dim_direction
      column: direction_sk
    description: Surrogate key of gold_dim_direction, looked up on its business key;
      '-1' when the dimension does not know the row.
  - name: delivered_date
    type: date
    required: false
    description: 'Partition column: the calendar date of `delivered_at`.'
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_fact_sms_logs

primary_key:
- message_sid

quality:
  dataset_rules:
  - unique:
      columns:
      - message_sid
      name: message_sid_unique
      category: uniqueness
      description: No two rows share the same message_sid.
  - name: currency_sk_unknown_member_rows
    sql: SELECT COUNT(*) FROM {dataset} WHERE currency_sk = '-1'
    must_be_less_than: 1
    severity: warning
    category: consistency
    description: Rows whose currency_sk fell back to the unknown member — the dimension
      did not know them when this fact ran.
  - name: status_sk_unknown_member_rows
    sql: SELECT COUNT(*) FROM {dataset} WHERE status_sk = '-1'
    must_be_less_than: 1
    severity: warning
    category: consistency
    description: Rows whose status_sk fell back to the unknown member — the dimension
      did not know them when this fact ran.
  - name: direction_sk_unknown_member_rows
    sql: SELECT COUNT(*) FROM {dataset} WHERE direction_sk = '-1'
    must_be_less_than: 1
    severity: warning
    category: consistency
    description: Rows whose direction_sk fell back to the unknown member — the dimension
      did not know them when this fact ran.

transformations:
- phase: pre
  sql: |-
    SELECT
      r.message_sid,
      r.sent_at,
      r.delivered_at,
      r.error_code,
      r.price AS message_price,
      CASE WHEN r.message_sid IS NOT NULL THEN 1 ELSE 0 END AS message_count,
      COALESCE(d1.currency_sk, '-1') AS currency_sk,
      COALESCE(d2.status_sk, '-1') AS status_sk,
      COALESCE(d3.direction_sk, '-1') AS direction_sk,
      CAST(r.delivered_at AS DATE) AS delivered_date
    FROM source r
    LEFT JOIN gold_dim_currency d1
      ON  r.price_unit = d1.currency_code
    LEFT JOIN gold_dim_sms_logs_status d2
      ON  r.status = d2.status
    LEFT JOIN gold_dim_direction d3
      ON  r.direction = d3.direction
- phase: pre
  derive:
    field: system
    sql: '''twilio'''

links:
- name: gold_dim_currency
  type: table
  path: table:`{domain_catalog_prefix}_reference`.{gold_layer}.{gold_layer}_dim_currency
- name: gold_dim_sms_logs_status
  type: table
  path: table:{gold_root}.{gold_layer}_dim_sms_logs_status
- name: gold_dim_direction
  type: table
  path: table:{gold_root}.{gold_layer}_dim_direction

upstream:
- gold_dim_currency
- gold_dim_direction
- gold_dim_sms_logs_status

materialization:
  strategy: append
  fact:
    type: transaction
  partition_by:
  - delivered_date

source:
  type: table
  path: table:{silver_root}.{silver_layer}_twilio_sms_logs
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
