version: 1.0.0

info:
  title: Gold — Fact Sms Logs Daily
  target_layer: gold
  description: Daily summaries of SMS messaging activity, one row per calendar day,
    sourced from Twilio. Each day carries the price charged for messages, supporting
    tracking of messaging spend, along with a numeric day label that ties the summary
    to a shared calendar for comparison with other daily reports. A source-system
    field records which system the activity originated from, so records can be told
    apart and traced back.
  table_name: '{gold_layer}_fact_sms_logs_daily'
  system: twilio
  domain: operations

model:
  fields:
  - name: activity_date
    type: date
    required: true
    description: The calendar day this SMS activity summary covers; each row represents
      one day of messaging activity.
  - name: message_price
    type: decimal(10,2)
    required: false
    description: The price charged for the message, used to track messaging costs
      and spend.
  - name: message_count
    type: integer
    required: false
    description: Number of SMS messages in the row.
  - name: date_key
    type: integer
    required: false
    foreign_key:
      contract: gold_dim_date
      column: date_key
    description: The day of activity_date as YYYYMMDD — the key of the date dimension.
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_fact_sms_logs_daily

primary_key:
- activity_date

quality:
  dataset_rules:
  - unique:
      columns:
      - activity_date
      name: activity_date_unique
      category: uniqueness
      description: No two rows share the same activity_date.

transformations:
- phase: pre
  sql: |-
    WITH touched AS (
      SELECT DISTINCT
        CAST(sent_at AS DATE) AS _touched_0
      FROM source
    ),
    r AS (
      SELECT
        CAST(sent_at AS DATE) AS activity_date,
        SUM(price) AS message_price,
        COUNT(message_sid) AS message_count
      FROM silver_twilio_sms_logs_full
      JOIN touched
        ON CAST(sent_at AS DATE) = touched._touched_0
      GROUP BY CAST(sent_at AS DATE)
    )
    SELECT
      r.activity_date,
      r.message_price,
      r.message_count,
      CAST(EXTRACT(YEAR FROM r.activity_date) AS BIGINT) * 10000 + CAST(EXTRACT(MONTH FROM r.activity_date) AS BIGINT) * 100 + CAST(EXTRACT(DAY FROM r.activity_date) AS BIGINT) AS date_key
    FROM r
- phase: pre
  derive:
    field: system
    sql: '''twilio'''

links:
- name: silver_twilio_sms_logs_full
  type: table
  path: table:{silver_root}.{silver_layer}_twilio_sms_logs

upstream: []

materialization:
  fact:
    type: aggregate

source:
  type: table
  path: table:{silver_root}.{silver_layer}_twilio_sms_logs
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
