version: 1.0.0

info:
  title: "Silver \u2014 Twilio SMS Logs"
  table_name: '{silver_layer}_twilio_sms_logs'
  description: "Cleaned, typed, and deduplicated SMS notification log records. PII\
    \ fields (phone numbers, message body) are masked at Silver \u2014 raw values\
    \ remain at Bronze for audit / re-process.\n"
  target_layer: silver
  domain: operations
  system: twilio

primary_key:
- MESSAGE_SID

model:
  fields:
  - name: MESSAGE_SID
    type: string
    required: true
  - name: RECIPIENT_PHONE
    type: string
    pii: true
    masking: hash
  - name: SENDER_PHONE
    type: string
    pii: true
    masking: hash
  - name: MESSAGE_BODY
    type: string
    pii: true
    masking: redact
  - name: STATUS
    type: string
    description: delivered | failed | undelivered | sent | queued
  - name: DIRECTION
    type: string
    description: outbound-api | inbound
  - name: NUM_SEGMENTS
    type: integer
  - name: PRICE
    type: float
  - name: PRICE_UNIT
    type: string
  - name: SENT_AT
    type: timestamp
  - name: DELIVERED_AT
    type: timestamp
  - name: ERROR_CODE
    type: string
    description: Twilio error code (null if delivered)

quality:
  row_rules:
  - name: message_sid_not_null
    sql: message_sid IS NOT NULL
  - name: valid_status
    sql: status IN ('delivered','failed','undelivered','sent','queued')
  dataset_rules:
  - unique: MESSAGE_SID

transformations:
- deduplicate:
    by:
    - MESSAGE_SID
    sort_by:
    - MESSAGE_SID

source:
  type: table
  path: table:{domain_catalog}.{bronze_layer}_{system}_sms_logs
  load_mode: full
