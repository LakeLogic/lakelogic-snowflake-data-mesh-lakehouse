version: 1.0.0

info:
  title: Gold — Dim Incident Type
  target_layer: gold
  description: 'grain: one row per incident_type'
  table_name: '{gold_layer}_dim_incident_type'
  system: trust_safety
  domain: operations

model:
  fields:
  - name: incident_type_sk
    type: string
    required: false
    description: 'Surrogate key: sha256 of the business key, written by the materializer;
      ''-1'' is the unknown member.'
  - name: incident_type
    type: string
    required: true
    description: Type of incident reported.
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_dim_incident_type

primary_key:
- incident_type

quality:
  dataset_rules:
  - unique:
      columns:
      - incident_type
      name: incident_type_unique
      category: uniqueness
      description: No two rows share the same incident_type.

materialization:
  scd1:
    surrogate_key: incident_type_sk
    surrogate_key_strategy: hash
    unknown_member:
      enabled: true
      surrogate_key_value: '-1'

transformations:
- phase: pre
  sql: |-
    SELECT DISTINCT incident_type
    FROM source
    WHERE incident_type IS NOT NULL
- phase: pre
  derive:
    field: system
    sql: '''trust_safety'''

source:
  type: table
  path: table:{silver_root}.{silver_layer}_trust_safety_incident_reports
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
