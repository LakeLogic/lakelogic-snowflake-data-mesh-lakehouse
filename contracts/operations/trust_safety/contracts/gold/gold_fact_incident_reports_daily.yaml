version: 1.0.0

info:
  title: Gold — Fact Incident Reports Daily
  target_layer: gold
  description: 'grain: one row per day'
  table_name: '{gold_layer}_fact_incident_reports_daily'
  system: trust_safety
  domain: operations

model:
  fields:
  - name: activity_date
    type: date
    required: true
    description: Calendar day the row summarises.
  - name: estimated_cost
    type: double
    required: false
    description: 'Measure candidate: sum of ''estimated_cost'' (needs confirmation).'
  - name: date_key
    type: integer
    required: false
    foreign_key:
      contract: gold_dim_date
      column: date_key
    description: The day of activity_date as YYYYMMDD — the key of the date dimension.
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_fact_incident_reports_daily

primary_key:
- activity_date

quality:
  dataset_rules:
  - unique:
      columns:
      - activity_date
      name: activity_date_unique
      category: uniqueness
      description: No two rows share the same activity_date.

transformations:
- phase: pre
  sql: |-
    WITH touched AS (
      SELECT DISTINCT
        CAST(incident_datetime AS DATE) AS _touched_0
      FROM source
    ),
    r AS (
      SELECT
        CAST(incident_datetime AS DATE) AS activity_date,
        SUM(estimated_cost) AS estimated_cost
      FROM silver_trust_safety_incident_reports_full
      JOIN touched
        ON CAST(incident_datetime AS DATE) = touched._touched_0
      GROUP BY CAST(incident_datetime AS DATE)
    )
    SELECT
      r.activity_date,
      r.estimated_cost,
      CAST(EXTRACT(YEAR FROM r.activity_date) AS BIGINT) * 10000 + CAST(EXTRACT(MONTH FROM r.activity_date) AS BIGINT) * 100 + CAST(EXTRACT(DAY FROM r.activity_date) AS BIGINT) AS date_key
    FROM r
- phase: pre
  derive:
    field: system
    sql: '''trust_safety'''

links:
- name: silver_trust_safety_incident_reports_full
  type: table
  path: table:{silver_root}.{silver_layer}_trust_safety_incident_reports

upstream: []

materialization:
  fact:
    type: aggregate

source:
  type: table
  path: table:{silver_root}.{silver_layer}_trust_safety_incident_reports
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
