version: 1.0.0

info:
  title: "Silver \u2014 Zendesk Support Tickets"
  table_name: '{silver_layer}_zendesk_support_tickets'
  description: Cleaned, typed, and deduplicated data.
  target_layer: silver
  domain: operations
  system: zendesk

model:
  fields:
  - name: TICKET_ID
    type: string
    required: true
  - name: ENTRY_POINT
    type: string
  - name: RIDER_ID
    type: string
    foreign_key:
      contract: '{silver_layer}_rideflow_rider_profiles'
      column: RIDER_ID
  - name: TRIP_ID
    type: string
    foreign_key:
      contract: '{silver_layer}_rideflow_trips'
      column: TRIP_ID
  - name: DRIVER_ID
    type: string
    foreign_key:
      contract: '{silver_layer}_rideflow_driver_profiles'
      column: DRIVER_ID
  - name: CHARGE_ID
    type: string
    foreign_key:
      contract: '{silver_layer}_stripe_charges'
      column: CHARGE_ID
  - name: REQUESTER_EMAIL
    type: string
    required: true
    pii: true
    masking: hash
  - name: REQUESTER_NAME
    type: string
    pii: true
    masking: redact
  - name: REQUESTER_PHONE
    type: string
    pii: true
    masking: redact
  - name: SUBJECT
    type: string
  - name: TICKET_DESCRIPTION
    type: string
  - name: STATUS
    type: string
  - name: PRIORITY
    type: string
  - name: CHANNEL
    type: string
  - name: ASSIGNEE
    type: string
  - name: TAGS_JSON
    type: string
  - name: CREATED_AT
    type: timestamp
  - name: UPDATED_AT
    type: timestamp
  - name: SOLVED_AT
    type: timestamp
  - name: SATISFACTION_RATING
    type: float

primary_key:
- TICKET_ID

quality:
  row_rules: []
  dataset_rules:
  - unique: TICKET_ID

transformations:
- deduplicate:
    by:
    - TICKET_ID
    sort_by:
    - TICKET_ID

source:
  type: table
  path: table:{domain_catalog}.{bronze_layer}_{system}_support_tickets
  load_mode: full
