version: 1.0.0

info:
  data_product: customer_support
  data_product_output: fact_ticket_enriched
  title: Gold — Fact Support Tickets
  target_layer: gold
  description: Customer support tickets raised through Zendesk, covering the full
    case lifecycle from when a ticket was first opened to when it was solved, along
    with its status, urgency and the channel the customer used to get in touch. Each
    case can be tied back to a specific trip and charge, and to the driver or rider
    involved, making it usable for billing questions and for tracing complaints to
    a particular ride. The customer's message is also classified by tone as negative,
    positive or neutral, and the record carries internal references to standard driver,
    rider, priority and channel definitions.
  table_name: '{gold_layer}_fact_support_tickets'
  system: zendesk
  domain: operations

model:
  fields:
  - name: ticket_id
    type: string
    required: true
    description: Unique identifier for a customer support ticket. Used to track and
      reference the case throughout its lifecycle.
  - name: created_at
    type: timestamp
    required: false
    description: Date and time the ticket was first raised, used to measure response
      times and case age.
  - name: solved_at
    type: timestamp
    required: false
    description: Date and time the ticket was marked as resolved, used to measure
      how long cases take to close.
  - name: rider_id
    type: string
    required: false
    description: Identifier for the rider associated with the support case, linking
      the ticket to a specific customer journey.
  - name: driver_id
    type: string
    required: false
    description: Identifier for the driver involved in the support case, used to connect
      the issue to the person who served the trip.
  - name: trip_id
    type: string
    required: false
    description: Identifier for the trip the support case relates to, allowing the
      issue to be traced back to a specific ride.
  - name: charge_id
    type: string
    required: false
    description: Identifier for the charge or payment associated with the support
      case, useful for resolving billing-related questions.
  - name: sentiment
    type: string
    required: true
    description: 'Derived from subject by rule: one of billing, service, safety, technical,
      neutral.'
  - name: rider_sk
    type: string
    required: true
    foreign_key:
      contract: gold_dim_rider_profiles
      column: rider_profiles_sk
    description: Surrogate key of gold_dim_rider_profiles, looked up as of created_at;
      '-1' when the dimension does not know the row.
  - name: driver_sk
    type: string
    required: true
    foreign_key:
      contract: gold_dim_driver_profiles
      column: driver_profiles_sk
    description: Surrogate key of gold_dim_driver_profiles, looked up as of created_at;
      '-1' when the dimension does not know the row.
  - name: status_sk
    type: string
    required: true
    foreign_key:
      contract: gold_dim_support_tickets_status
      column: status_sk
    description: Surrogate key of gold_dim_support_tickets_status, looked up on its
      business key; '-1' when the dimension does not know the row.
  - name: priority_sk
    type: string
    required: true
    foreign_key:
      contract: gold_zendesk_dim_priority
      column: priority_sk
    description: Surrogate key of gold_zendesk_dim_priority, looked up on its business
      key; '-1' when the dimension does not know the row.
  - name: channel_sk
    type: string
    required: true
    foreign_key:
      contract: gold_dim_channel
      column: channel_sk
    description: Surrogate key of gold_dim_channel, looked up on its business key;
      '-1' when the dimension does not know the row.
  - name: entry_point_sk
    type: string
    required: true
    foreign_key:
      contract: gold_dim_entry_point
      column: entry_point_sk
    description: Surrogate key of gold_dim_entry_point, looked up on its business
      key; '-1' when the dimension does not know the row.
  - name: created_date
    type: date
    required: false
    description: 'Partition column: the calendar date of `created_at`.'
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_fact_support_tickets

primary_key:
- ticket_id

quality:
  row_rules:
  - name: sentiment_accepted_values
    sql: sentiment IN ('billing', 'service', 'safety', 'technical', 'neutral')
    category: validity
    description: 'sentiment is one of: billing, service, safety, technical, neutral.'
  dataset_rules:
  - unique:
      columns:
      - ticket_id
      name: ticket_id_unique
      category: uniqueness
      description: No two rows share the same ticket_id.
  - name: rider_sk_unknown_member_rows
    sql: SELECT COUNT(*) FROM {dataset} WHERE rider_sk = '-1'
    must_be_less_than: 1
    severity: warning
    category: consistency
    description: Rows whose rider_sk fell back to the unknown member — the dimension
      did not know them when this fact ran.
  - name: driver_sk_unknown_member_rows
    sql: SELECT COUNT(*) FROM {dataset} WHERE driver_sk = '-1'
    must_be_less_than: 1
    severity: warning
    category: consistency
    description: Rows whose driver_sk fell back to the unknown member — the dimension
      did not know them when this fact ran.
  - name: status_sk_unknown_member_rows
    sql: SELECT COUNT(*) FROM {dataset} WHERE status_sk = '-1'
    must_be_less_than: 1
    severity: warning
    category: consistency
    description: Rows whose status_sk fell back to the unknown member — the dimension
      did not know them when this fact ran.
  - name: priority_sk_unknown_member_rows
    sql: SELECT COUNT(*) FROM {dataset} WHERE priority_sk = '-1'
    must_be_less_than: 1
    severity: warning
    category: consistency
    description: Rows whose priority_sk fell back to the unknown member — the dimension
      did not know them when this fact ran.
  - name: channel_sk_unknown_member_rows
    sql: SELECT COUNT(*) FROM {dataset} WHERE channel_sk = '-1'
    must_be_less_than: 1
    severity: warning
    category: consistency
    description: Rows whose channel_sk fell back to the unknown member — the dimension
      did not know them when this fact ran.
  - name: entry_point_sk_unknown_member_rows
    sql: SELECT COUNT(*) FROM {dataset} WHERE entry_point_sk = '-1'
    must_be_less_than: 1
    severity: warning
    category: consistency
    description: Rows whose entry_point_sk fell back to the unknown member — the dimension
      did not know them when this fact ran.

transformations:
- phase: pre
  sql: |-
    SELECT
      r.ticket_id,
      r.created_at,
      r.solved_at,
      r.rider_id,
      r.driver_id,
      r.trip_id,
      r.charge_id,
      CASE WHEN (LOWER(r.subject) LIKE '%refund%' OR LOWER(r.subject) LIKE '%charged twice%' OR LOWER(r.subject) LIKE '%overcharged%' OR LOWER(r.subject) LIKE '%billing%') THEN 'billing' WHEN (LOWER(r.subject) LIKE '%late%' OR LOWER(r.subject) LIKE '%delay%' OR LOWER(r.subject) LIKE '%waited%' OR LOWER(r.subject) LIKE '%no show%') THEN 'service' WHEN (LOWER(r.subject) LIKE '%unsafe%' OR LOWER(r.subject) LIKE '%accident%' OR LOWER(r.subject) LIKE '%rude%' OR LOWER(r.subject) LIKE '%harass%') THEN 'safety' WHEN (LOWER(r.subject) LIKE '%app%' OR LOWER(r.subject) LIKE '%login%' OR LOWER(r.subject) LIKE '%crash%' OR LOWER(r.subject) LIKE '%error%') THEN 'technical' ELSE 'neutral' END AS sentiment,
      COALESCE(d1.rider_profiles_sk, '-1') AS rider_sk,
      COALESCE(d2.driver_profiles_sk, '-1') AS driver_sk,
      COALESCE(d3.status_sk, '-1') AS status_sk,
      COALESCE(d4.priority_sk, '-1') AS priority_sk,
      COALESCE(d5.channel_sk, '-1') AS channel_sk,
      COALESCE(d6.entry_point_sk, '-1') AS entry_point_sk,
      CAST(r.created_at AS DATE) AS created_date
    FROM source r
    LEFT JOIN gold_dim_rider_profiles d1
      ON  r.rider_id = d1.rider_id
      AND r.created_at >= d1.effective_from
      AND r.created_at < COALESCE(d1.effective_to, CAST('9999-12-31 00:00:00' AS TIMESTAMP))
    LEFT JOIN gold_dim_driver_profiles d2
      ON  r.driver_id = d2.driver_id
      AND r.created_at >= d2.effective_from
      AND r.created_at < COALESCE(d2.effective_to, CAST('9999-12-31 00:00:00' AS TIMESTAMP))
    LEFT JOIN gold_dim_support_tickets_status d3
      ON  r.status = d3.status
    LEFT JOIN gold_zendesk_dim_priority d4
      ON  r.priority = d4.priority
    LEFT JOIN gold_dim_channel d5
      ON  r.channel = d5.channel
    LEFT JOIN gold_dim_entry_point d6
      ON  r.entry_point = d6.entry_point
- phase: pre
  derive:
    field: system
    sql: '''zendesk'''

links:
- name: gold_dim_rider_profiles
  type: table
  path: table:`{domain_catalog_prefix}_marketplace`.{gold_layer}.{gold_layer}_dim_rider_profiles
- name: gold_dim_driver_profiles
  type: table
  path: table:`{domain_catalog_prefix}_marketplace`.{gold_layer}.{gold_layer}_dim_driver_profiles
- name: gold_dim_support_tickets_status
  type: table
  path: table:{gold_root}.{gold_layer}_dim_support_tickets_status
- name: gold_zendesk_dim_priority
  type: table
  path: table:{gold_root}.{gold_layer}_zendesk_dim_priority
- name: gold_dim_channel
  type: table
  path: table:{gold_root}.{gold_layer}_dim_channel
- name: gold_dim_entry_point
  type: table
  path: table:{gold_root}.{gold_layer}_dim_entry_point

upstream:
- gold_dim_channel
- gold_dim_driver_profiles
- gold_dim_entry_point
- gold_dim_rider_profiles
- gold_dim_support_tickets_status
- gold_zendesk_dim_priority

materialization:
  fact:
    type: accumulating_snapshot
    milestone_dates:
    - created_at
    - solved_at
  partition_by:
  - created_date

source:
  type: table
  path: table:{silver_root}.{silver_layer}_zendesk_support_tickets
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
