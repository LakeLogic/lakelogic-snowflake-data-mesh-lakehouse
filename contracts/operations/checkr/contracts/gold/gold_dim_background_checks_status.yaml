version: 1.0.0

info:
  title: Gold — Dim Background Checks Status
  target_layer: gold
  description: 'grain: one row per status'
  table_name: '{gold_layer}_dim_background_checks_status'
  system: checkr
  domain: operations

model:
  fields:
  - name: status_sk
    type: string
    required: false
    description: 'Surrogate key: sha256 of the business key, written by the materializer;
      ''-1'' is the unknown member.'
  - name: status
    type: string
    required: true
    description: The current stage of the background check process, indicating whether
      the report is pending, in progress, or complete.
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_dim_background_checks_status

primary_key:
- status

quality:
  dataset_rules:
  - unique:
      columns:
      - status
      name: status_unique
      category: uniqueness
      description: No two rows share the same status.

materialization:
  scd1:
    surrogate_key: status_sk
    surrogate_key_strategy: hash
    unknown_member:
      enabled: true
      surrogate_key_value: '-1'

transformations:
- phase: pre
  sql: |-
    SELECT DISTINCT status
    FROM source
    WHERE status IS NOT NULL
- phase: pre
  derive:
    field: system
    sql: '''checkr'''

source:
  type: table
  path: table:{silver_root}.{silver_layer}_checkr_background_checks
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
