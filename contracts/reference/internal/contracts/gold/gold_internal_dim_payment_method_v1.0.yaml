version: 1.0.0

info:
  title: "Gold \u2014 Dim Payment Method"
  table_name: '{gold_layer}_internal_dim_payment_method'
  description: 'Payment-method dimension (card, apple_pay, google_pay, cash, wallet)
    with PCI/cashflow flags. Joined by stripe charges and reconciliation facts.

    '
  target_layer: gold
  domain: reference
  system: internal

model:
  fields:
  - name: PAYMENT_METHOD_CODE
    type: string
    required: true
    description: Internal stable code (e.g. CARD, APPLE_PAY)
  - name: PAYMENT_METHOD_NAME
    type: string
  - name: RAIL
    type: string
    description: Settlement rail (card, wallet, cash, bank)
  - name: REQUIRES_STRONG_AUTH
    type: boolean
    description: PSD2 strong customer authentication required
  - name: SETTLES_INSTANTLY
    type: boolean

quality:
  row_rules: []
  dataset_rules:
  - unique: PAYMENT_METHOD_CODE

primary_key:
- PAYMENT_METHOD_CODE

source:
  type: table
  path: table:{catalog}.LANDING.internal_dim_payment_method_seed
  format: csv
  options:
    header: 'true'
  load_mode: full
  watermark_strategy: none
