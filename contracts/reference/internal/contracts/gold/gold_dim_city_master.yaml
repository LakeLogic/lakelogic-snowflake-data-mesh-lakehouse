version: 1.0.0

info:
  data_product: reference_data
  data_product_output: dim_city
  title: Gold — Dim City Master (SCD2)
  target_layer: gold
  description: A versioned reference list of cities, each tied to a country code and
    carrying the short city code used to link it to other records elsewhere. Every
    row records when that version became active and when it stopped, whether it is
    the current one, and which source system it came from, so past and present city
    details can be told apart. No personal data or monetary amounts appear in the
    columns shown.
  table_name: '{gold_layer}_dim_city_master'
  system: internal
  domain: reference

model:
  fields:
  - name: city_master_sk
    type: string
    required: false
    description: 'Surrogate key: sha256 of the business key and the version start,
      written by the materializer; ''-1'' is the unknown member.'
  - name: city_code
    type: string
    required: true
    description: The short code that identifies this city in internal systems; used
      to link city details to other records.
  - name: city_name
    type: string
    required: false
    description: The display name of the city as it should appear to business users
      and reports.
  - name: country_code
    type: string
    required: false
    description: The code for the country this city belongs to, used for grouping
      and regional reporting.
  - name: timezone
    type: string
    required: false
    description: The standard time zone for the city, used to schedule activities
      and interpret timestamps correctly.
  - name: default_currency
    type: string
    required: false
    description: The currency normally used for business in this city, useful for
      pricing and financial reporting.
  - name: geofence_wkt
    type: string
    required: false
    description: The geographic boundary of the city, used to determine whether a
      location falls inside the city area.
  - name: launched_at
    type: timestamp
    required: false
    description: The date the city became active for business; helps track when a
      market opened.
  - name: sunset_at
    type: timestamp
    required: false
    description: The date the city stopped being active for business, if applicable;
      used to exclude closed markets from current reporting.
  - name: effective_from
    type: timestamp
    required: false
    description: SCD2 effective from, written by the materializer.
  - name: effective_to
    type: timestamp
    required: false
    description: SCD2 effective to, written by the materializer.
  - name: is_current
    type: boolean
    required: false
    description: SCD2 current flag, written by the materializer.
  - name: version_number
    type: long
    required: false
    description: SCD2 version column, written by the materializer.
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_dim_city_master

primary_key:
- city_code

materialization:
  strategy: scd2
  scd2:
    surrogate_key: city_master_sk
    surrogate_key_strategy: hash
    effective_from_field: effective_from
    effective_to_field: effective_to
    current_flag_field: is_current
    version_column: version_number
    track_columns:
    - city_name
    - country_code
    - timezone
    - default_currency
    - geofence_wkt
    - sunset_at
    unknown_member:
      enabled: true
      surrogate_key_value: '-1'

quality:
  dataset_rules:
  - unique:
      columns:
      - city_code
      - effective_from
      name: city_code_effective_from_unique
      category: uniqueness
      description: No two rows share the same city_code, effective_from.

source:
  type: table
  path: table:{silver_root}.{silver_layer}_internal_city_master
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'

transformations:
- phase: pre
  derive:
    field: system
    sql: '''internal'''
