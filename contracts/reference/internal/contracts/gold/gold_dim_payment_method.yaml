version: 1.0.0

info:
  data_product: reference_data
  data_product_output: dim_payment_method
  title: Gold — Dim Payment Method
  target_layer: gold
  description: A reference list of the ways customers can pay, each with a short code,
    a recognisable name, and the channel or network it runs on, such as card, bank
    transfer or wallet. It also records whether a method needs extra customer verification,
    like a one-time code, and whether funds settle immediately or after a delay. Records
    carry the source system they came from, and an unknown or unmatched method is
    represented by the special value '-1'.
  table_name: '{gold_layer}_dim_payment_method'
  system: internal
  domain: reference

model:
  fields:
  - name: payment_method_sk
    type: string
    required: false
    description: 'Surrogate key: sha256 of the business key, written by the materializer;
      ''-1'' is the unknown member.'
  - name: payment_method_code
    type: string
    required: true
    description: Short identifier for the payment method, used to reference it consistently
      across systems and reports.
  - name: payment_method_name
    type: string
    required: false
    description: Human-readable name of the payment method as customers and staff
      would recognise it.
  - name: rail
    type: string
    required: false
    description: The payment channel or network the method runs on, such as card,
      bank transfer, or wallet.
  - name: requires_strong_auth
    type: boolean
    required: false
    description: Indicates whether this payment method needs extra customer verification
      (such as a one-time code) before a payment can complete.
  - name: settles_instantly
    type: boolean
    required: false
    description: Indicates whether funds for this payment method are settled immediately
      rather than after a delay.
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_dim_payment_method

primary_key:
- payment_method_code

materialization:
  scd1:
    surrogate_key: payment_method_sk
    surrogate_key_strategy: hash
    unknown_member:
      enabled: true
      surrogate_key_value: '-1'

source:
  type: table
  path: table:{silver_root}.{silver_layer}_internal_dim_payment_method_seed
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'

transformations:
- phase: pre
  derive:
    field: system
    sql: '''internal'''
