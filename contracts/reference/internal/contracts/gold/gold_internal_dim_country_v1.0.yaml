version: 1.0.0

info:
  title: "Gold \u2014 Dim Country"
  table_name: '{gold_layer}_internal_dim_country'
  description: 'ISO 3166-1 country dimension. Loaded once from a static CSV seed;
    can be refreshed when ISO publishes a new revision.

    '
  target_layer: gold
  domain: reference
  system: internal

model:
  fields:
  - name: COUNTRY_ALPHA3
    type: string
    required: true
    description: ISO 3166-1 alpha-3 (e.g. GBR, USA, IND)
  - name: COUNTRY_ALPHA2
    type: string
    description: ISO 3166-1 alpha-2 (e.g. GB, US, IN)
  - name: COUNTRY_NAME
    type: string
  - name: COUNTRY_NUMERIC
    type: int
  - name: REGION
    type: string
    description: UN M.49 region (Europe, Americas, Asia, ...)
  - name: SUB_REGION
    type: string

quality:
  row_rules: []
  dataset_rules:
  - unique: COUNTRY_ALPHA3

primary_key:
- COUNTRY_ALPHA3

source:
  type: table
  path: table:{catalog}.LANDING.internal_dim_country_seed
  format: csv
  options:
    header: 'true'
  load_mode: full
  watermark_strategy: none
