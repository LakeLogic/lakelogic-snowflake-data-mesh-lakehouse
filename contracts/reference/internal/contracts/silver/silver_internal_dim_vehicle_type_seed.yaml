version: 1.0.0

info:
  title: Silver — Internal Dim Vehicle Type Seed
  target_layer: silver
  description: A reference list of vehicle types, each identified by a short code
    and carrying a human-readable name used when describing a vehicle category to
    staff and customers. Alongside the name it records the passenger capacity the
    type is designed to carry, the product or service tier the type belongs to, and
    whether the type must pass an inspection before use. The codes exist so vehicle
    records can be linked back to their type.
  table_name: '{silver_layer}_internal_dim_vehicle_type_seed'
  system: internal
  domain: reference

model:
  fields:
  - name: vehicle_type_code
    type: string
    required: true
    description: Short code that uniquely identifies each vehicle type in the reference
      list, used to link vehicle records to their type.
  - name: vehicle_type_name
    type: string
    required: true
    description: The human-readable name of the vehicle type, shown to staff and customers
      when describing a vehicle category.
  - name: passenger_capacity
    type: Int64
    required: true
    description: The number of passengers the vehicle type is designed to carry, used
      for capacity planning and booking rules.
  - name: product_tier
    type: string
    required: true
    description: The product or service tier this vehicle type belongs to, indicating
      the level of offering it represents.
  - name: requires_inspection
    type: boolean
    required: true
    description: Whether this vehicle type must pass an inspection before use, flagging
      types that carry extra compliance obligations.

primary_key:
- vehicle_type_code

quality:
  row_rules:
  - name: vehicle_type_code_not_null
    sql: vehicle_type_code IS NOT NULL
    category: completeness
    description: vehicle_type_code is always present (never null).
  - name: passenger_capacity_not_null
    sql: passenger_capacity IS NOT NULL
    category: completeness
    description: passenger_capacity is always present (never null).
  - name: product_tier_not_null
    sql: product_tier IS NOT NULL
    category: completeness
    description: product_tier is always present (never null).
  - name: requires_inspection_not_null
    sql: requires_inspection IS NOT NULL
    category: completeness
    description: requires_inspection is always present (never null).
  - name: vehicle_type_name_not_null
    sql: vehicle_type_name IS NOT NULL
    category: completeness
    description: vehicle_type_name is always present (never null).

transformations:
- deduplicate:
    by:
    - vehicle_type_code
    sort_by:
    - _lakelogic_processed_at
    order: desc

dataset: silver_internal_dim_vehicle_type_seed

source:
  type: table
  path: table:{bronze_root}.{bronze_layer}_internal_dim_vehicle_type_seed
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
