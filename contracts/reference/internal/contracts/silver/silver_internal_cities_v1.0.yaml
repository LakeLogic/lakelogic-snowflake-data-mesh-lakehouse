version: 1.0.0

info:
  title: "Silver \u2014 Internal Cities"
  table_name: '{silver_layer}_internal_cities'
  description: 'Cleaned + typed city master. Deduplicated on city_code, validated
    against ISO country codes and IANA timezones. Feeds dim_city (SCD2) and is joined
    by every fact_ table that needs geographic attribution.

    '
  target_layer: silver
  domain: reference
  system: internal

model:
  fields:
  - name: CITY_CODE
    type: string
    required: true
  - name: CITY_NAME
    type: string
  - name: COUNTRY_CODE
    type: string
  - name: TIMEZONE
    type: string
  - name: DEFAULT_CURRENCY
    type: string
  - name: GEOFENCE_WKT
    type: string
  - name: LAUNCHED_AT
    type: timestamp
  - name: SUNSET_AT
    type: timestamp
  - name: IS_ACTIVE
    type: boolean
    description: 'Derived: sunset_at IS NULL'

quality:
  row_rules: []
  dataset_rules:
  - unique: CITY_CODE

transformations:
- deduplicate:
    by:
    - CITY_CODE
    sort_by:
    - CITY_CODE

source:
  type: table
  path: table:{domain_catalog}.{bronze_layer}_{system}_city_master
  load_mode: full
